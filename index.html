      <button class="btn btn-primary btn-sm">Añadir</button>
    </form>
    <div class="quick"><span>o en</span>${[5, 15, 30, 60].map(m => `<button type="button" class="pill" data-act="remQuick" data-min="${m}">${m < 60 ? m + ' min' : '1 hora'}</button>`).join('')}</div>
    ${up.length ? `<ul class="list">${up.map(remItem).join('')}</ul>` : empty('Sin recordatorios pendientes', 'bell-simple-slash')}
    ${past.length ? `<details class="past"><summary>Pasados (${past.length})</summary><ul class="list">${past.map(remItem).join('')}</ul><button class="btn btn-sm" data-act="remClear">Limpiar pasados</button></details>` : ''}`;
}
function renderReminderLists() { $$('[data-reminders]').forEach(el => el.innerHTML = remindersCardHtml()); }

function checkReminders(now) {
  let dirty = false;
  const recent = t => now - t < 6 * 3600e3; // lo muy antiguo se marca sin avisar
  for (const e of S.events) {
    if (e.fired || e.done) continue;
    const t = eventTrigger(e);
    if (t == null || t > now) continue;
    e.fired = true; dirty = true;
    if (recent(t)) {
      const day = e.date === ymd(new Date()) ? 'Hoy' : e.date === ymd(addDays(new Date(), 1)) ? 'Mañana' : shortDate(e.date);
      alertUser(e.title, `${day}${e.time ? ' a las ' + e.time : ''} · ${cat(e.cat).label}`, 'alarm', [{ label: 'Entendido', primary: true }]);
    }
  }
  for (const r of S.reminders) {
    if (r.fired) continue;
    const t = new Date(r.at).getTime();
    if (isNaN(t) || t > now) continue;
    r.fired = true; dirty = true;
    if (recent(t)) alertUser('Recordatorio', r.text, 'bell-ringing', [
      { label: 'Posponer 5 min', fn: () => { r.at = localIso(new Date(Date.now() + 5 * 60000)); r.fired = false; save(); renderReminderLists(); } },
      { label: 'Listo', primary: true },
    ]);
  }
  const nowD = new Date(now), yr = nowD.getFullYear();
  if (nowD.getHours() >= 9) for (const b of S.birthdays) {
    if (!b.notify || b.notifiedYear === yr || !bdOn(b, nowD)) continue;
    b.notifiedYear = yr; dirty = true;
    alertUser(`¡Hoy cumple ${b.name}!`, b.year ? `Cumple ${yr - b.year} años. ¡No olvides saludar!` : '¡No olvides saludar!', 'cake', [{ label: 'Listo', primary: true }]);
  }
  const tk = ymd(nowD), nowMin = nowD.getHours() * 60 + nowD.getMinutes();
  for (const h of S.habits) {
    if (!h.remind || h.remindedOn === tk || !hbScheduled(h, nowD) || hbDone(h, tk)) continue;
    const rm = toMin(h.remind);
    if (nowMin < rm || nowMin - rm > 360) continue;
    h.remindedOn = tk; dirty = true;
    alertUser(`Hora de: ${h.name}`, hbGoal(h) > 1 ? `Llevas ${hbCount(h, tk)} de ${hbGoal(h)} hoy.` : 'Márcalo cuando lo hagas.', 'plant',
      [{ label: 'Hecho', primary: true, fn: () => { hbSet(h, tk, hbGoal(h)); renderAll(); } }, { label: 'Después' }]);
  }
  if (dirty) { saveBg(); renderReminderLists(); }
}

/* ---------- Pomodoro, timers y cronómetro ---------- */
const pomoDur = (mode = S.pomo.mode) => (mode === 'work' ? S.pomo.work : S.pomo.rest) * 60000;
const pomoLeft = () => S.pomo.endAt ? Math.max(0, S.pomo.endAt - Date.now()) : S.pomo.left;
const pomoToday = () => S.pomo.countDate === ymd(new Date()) ? S.pomo.count : 0;
const timerLeft = t => t.endAt ? Math.max(0, t.endAt - Date.now()) : t.left;
const swElapsed = () => S.sw.acc + (S.sw.startAt ? Date.now() - S.sw.startAt : 0);
function pomoNext(finished) {
  const p = S.pomo;
  if (finished && p.mode === 'work') {
    const k = ymd(new Date());
    if (p.countDate !== k) { p.countDate = k; p.count = 0; }
    p.count++;
  }
  p.mode = p.mode === 'work' ? 'rest' : 'work';
  p.left = pomoDur(); p.endAt = null;
  save();
}
function startTimer(label, mins) {
  const dur = Math.round(mins * 60000);
  S.timers.push({ id: uid(), label: label || `Timer ${mins} min`, dur, left: dur, endAt: Date.now() + dur });
  save(); renderAll();
}

function updateTickers() {
  const now = new Date(), p = S.pomo, left = pomoLeft(), dur = pomoDur();
  $$('[data-clock]').forEach(el => el.textContent = hhmm(now));
  $$('[data-pomo-time]').forEach(el => el.textContent = fmtDur(left));
  $$('[data-pomo-mode]').forEach(el => el.textContent = p.mode === 'work' ? 'Enfoque' : 'Descanso');
  $$('[data-pomo-btn]').forEach(el => el.textContent = p.endAt ? 'Pausar' : left < dur ? 'Continuar' : 'Iniciar');
  const C = 2 * Math.PI * 52;
  $$('[data-pomo-arc]').forEach(el => { el.style.strokeDasharray = C; el.style.strokeDashoffset = C * (1 - Math.min(1, left / dur)); });
  for (const t of S.timers) {
    const l = timerLeft(t);
    $$(`[data-timer="${t.id}"]`).forEach(el => el.textContent = fmtDur(l));
    $$(`[data-timer-bar="${t.id}"]`).forEach(el => el.style.width = (100 * l / t.dur) + '%');
    $$(`[data-timer-btn="${t.id}"]`).forEach(el => el.textContent = t.endAt ? 'Pausar' : l < t.dur ? 'Continuar' : 'Iniciar');
  }
  if (present) $$('[data-present-time]').forEach(el => el.textContent = fmtDur(Math.floor((Date.now() - present.start) / 1000) * 1000));
  $$('[data-sw]').forEach(el => el.textContent = fmtSw(swElapsed()));
  $$('[data-sw-btn]').forEach(el => el.textContent = S.sw.startAt ? 'Pausar' : 'Iniciar');
  const running = S.timers.find(t => t.endAt);
  document.title = p.endAt ? `${fmtDur(left)} · ${p.mode === 'work' ? 'Enfoque' : 'Descanso'} — Convalaria`
    : running ? `${fmtDur(timerLeft(running))} · ${running.label} — Convalaria` : 'Convalaria';
}

let tickN = 0, lastDay = ymd(new Date());
function tick() {
  const now = Date.now(), p = S.pomo;
  if (p.endAt && now >= p.endAt) {
    const was = p.mode;
    pomoNext(true);
    alertUser(was === 'work' ? '¡Terminó tu enfoque!' : 'Fin del descanso',
      was === 'work' ? `Tómate ${S.pomo.rest} minutos para ti` : 'A enfocarse de nuevo', 'timer',
      [{ label: was === 'work' ? 'Iniciar descanso' : 'Iniciar enfoque', primary: true, fn: () => { S.pomo.endAt = Date.now() + S.pomo.left; save(); updateTickers(); } }]);
    renderAll();
  }
  for (const t of S.timers) {
    if (!t.endAt || now < t.endAt) continue;
    t.endAt = null; t.left = t.dur; save();
    alertUser(`${t.label} terminó`, `${fmtDur(t.dur)} completados`, 'timer',
      [{ label: 'Repetir', fn: () => { t.endAt = Date.now() + t.dur; save(); updateTickers(); } }, { label: 'Listo', primary: true }]);
  }
  if (tickN++ % 5 === 0) {
    checkReminders(now);
    applyMode();
    const k = ymd(new Date());
    if (k !== lastDay) { lastDay = k; renderAll(); }
  }
  updateTickers();
}

/* ---------- Tablero decorativo ---------- */
let boardSel = null;
const curBoard = () => $('[data-board]', $('#view-' + current));
function boardHtml() {
  return `<div class="card-h"><h2>Mi tablero</h2><div class="btns">
      <button class="btn btn-sm" data-act="boardPhoto">${ic('image')} Fotos</button>

}
function mountBoard(board) {
  if (!board) return;
  board.innerHTML = S.board.length ? '' : '<div class="board-empty">Decora este espacio con tus fotos, stickers y notas</div>';
  S.board.forEach((it, i) => {
    const n = document.createElement('div');
    n.className = `bi bi-${it.type}${it.id === boardSel ? ' sel' : ''}`;
    n.dataset.id = it.id;
    n.style.left = it.x + '%'; n.style.top = it.y + '%';
    n.style.width = it.w + 'px'; n.style.zIndex = i + 1;
    n.style.setProperty('--rot', (it.rot || 0) + 'deg');
    if (it.type === 'photo') {
      const img = document.createElement('img');
      img.src = IMG.get(it.imgId) || ''; img.alt = ''; img.draggable = false;
      n.appendChild(img);
    } else if (it.type === 'sticker') {
      n.innerHTML = stickerHtml(it.icon || 'heart'); n.style.fontSize = (it.w * 0.9) + 'px';
      n.style.color = it.color || STICKER_COLORS[0];
    } else {
      n.textContent = it.text; n.style.setProperty('--note', it.color || NOTE_COLORS[0]);
    }
    board.appendChild(n);
  });
  board.onpointerdown = boardPointerDown;
  renderBoardTools(board);
}
function renderBoardTools(board) {
  const tools = $('[data-boardtools]', board.parentElement);
  if (!tools) return;
  const it = S.board.find(x => x.id === boardSel);
  if (!it) { tools.innerHTML = '<span class="hint" style="margin:0">Arrastra para mover. Toca un elemento para agrandarlo, girarlo o cambiarlo.</span>'; return; }
  const b = (op, label, title) => `<button class="btn btn-sm" data-act="bt" data-op="${op}" title="${title}" aria-label="${title}">${label}</button>`;
  tools.innerHTML = b('smaller', ic('minus'), 'Más pequeño') + b('bigger', ic('plus'), 'Más grande') + b('rotL', ic('arrow-counter-clockwise'), 'Girar a la izquierda') + b('rotR', ic('arrow-clockwise'), 'Girar a la derecha')
    + b('front', ic('stack') + ' Al frente', 'Traer al frente')
    + (it.type === 'photo' ? b('swap', ic('swap') + ' Cambiar foto', 'Cambiar foto') : b('edit', ic('pencil-simple') + ' Editar', 'Editar'))
    + `<button class="btn btn-sm btn-danger" data-act="bt" data-op="del">${ic('trash')} Quitar</button>` + b('done', ic('check') + ' Listo', 'Terminar edición');
}
function boardPointerDown(e) {
  const board = e.currentTarget, n = e.target.closest('.bi');
  if (!n) {
    if (boardSel) { boardSel = null; $$('.bi', board).forEach(x => x.classList.remove('sel')); renderBoardTools(board); }
    return;
  }
  const it = S.board.find(x => x.id === n.dataset.id);
  if (!it) return;
  e.preventDefault();
  const rect = board.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ox = it.x, oy = it.y;
  let moved = false;
  try { n.setPointerCapture(e.pointerId); } catch {}
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true; n.classList.add('dragging');
    it.x = clamp(ox + dx / rect.width * 100, -5, 95);
    it.y = clamp(oy + dy / rect.height * 100, -5, 95);
    n.style.left = it.x + '%'; n.style.top = it.y + '%';
  };
  const up = () => {
    n.removeEventListener('pointermove', move); n.removeEventListener('pointerup', up); n.removeEventListener('pointercancel', up);
    n.classList.remove('dragging');
    if (moved) save();
    boardSel = it.id;
    $$('.bi', board).forEach(x => x.classList.toggle('sel', x.dataset.id === boardSel));
    renderBoardTools(board);
  };
  n.addEventListener('pointermove', move); n.addEventListener('pointerup', up); n.addEventListener('pointercancel', up);
}
const placeNew = () => ({ id: uid(), x: rand(5, 60), y: rand(5, 55), rot: Math.round(rand(-7, 7)) });

/* ---------- Vistas ---------- */
let pDate = new Date();

function renderInicio(root) {
  const now = new Date(), k = ymd(now);

function plannerLabel() {
  if (S.plannerView === 'dia') return cap(fmtLong(pDate)) + ' ' + pDate.getFullYear();
  if (S.plannerView === 'mes') return cap(MESES[pDate.getMonth()]) + ' ' + pDate.getFullYear();
  const s = startOfWeek(pDate), e = addDays(s, 6);
  return `${s.getDate()} ${MESES[s.getMonth()].slice(0, 3)} – ${e.getDate()} ${MESES[e.getMonth()].slice(0, 3)} ${e.getFullYear()}`;
}
function renderPlanner(root) {
  const v = S.plannerView;
  root.innerHTML = `
    <div class="page-h">
      <div><h1>Planner</h1><p class="sub">${plannerLabel()}</p></div>
      <div class="toolbar">
        <div class="seg">${[['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes']].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" data-act="pView" data-v="${k}" aria-pressed="${v === k}">${l}</button>`).join('')}</div>
        <div class="navgrp"><button class="icon-btn" data-act="pNav" data-d="-1" aria-label="Anterior">${ic('caret-left')}</button><button class="btn btn-sm" data-act="pToday">Hoy</button><button class="icon-btn" data-act="pNav" data-d="1" aria-label="Siguiente">${ic('caret-right')}</button></div>
        ${v !== 'mes' ? `<label class="toggle"><input type="checkbox" data-chg="showBlocks" ${S.showBlocks ? 'checked' : ''}> Horario fijo</label>` : ''}

      </div>
    </div>
    <div class="legend">${Object.values(CATS).map(c => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>
    ${v === 'dia' ? dayView() : v === 'semana' ? weekView() : monthView()}`;
}
function dayView() {
  const items = dayAgenda(pDate);
  return `<div class="card day-card"><h2 class="${ymd(pDate) === ymd(new Date()) ? 'is-today' : ''}">${fmtLong(pDate)}</h2>
    ${items.length ? `<ul class="list big">${agendaHtml(items)}</ul>` : empty('Nada por aquí todavía. ¡Añade algo lindo!')}</div>`;
}
function chip(it) {
  const x = it.x;
  if (it.k === 'bd') return `<button class="chip chip-bd" data-act="bdEdit" data-id="${x.id}">${ic('cake')} ${esc(x.name)}</button>`;
  if (it.k === 'e') return `<button class="chip ${x.done ? 'done' : ''}" style="${catVars(x.cat)}" data-act="evEdit" data-id="${x.id}">${x.time ? `<small>${x.time}</small>` : ''}${esc(x.title)}</button>`;
  return `<button class="chip chip-block" style="${catVars(x.cat)}" data-act="blockEdit" data-id="${x.id}"><small>${x.start}–${x.end}</small>${esc(x.title)}</button>`;
}
function weekView() {
  const s = startOfWeek(pDate), t = ymd(new Date());
  return `<div class="week">${DIAS_C.map((dn, i) => {
    const d = addDays(s, i), k = ymd(d);
    return `<div class="wcol ${k === t ? 'today' : ''}">
      <button class="wcol-h" data-act="pGoDay" data-date="${k}"><span>${dn}</span><strong>${d.getDate()}</strong></button>
      <div class="wcol-b">${dayAgenda(d).map(chip).join('')}</div>
      <button class="wadd" data-act="evNew" data-date="${k}" aria-label="Añadir el ${DIAS[i]} ${d.getDate()}">${ic('plus')}</button>
    </div>`;
  }).join('')}</div>`;
}
function monthView() {
  const y = pDate.getFullYear(), m = pDate.getMonth(), first = new Date(y, m, 1);
  const start = addDays(first, -dow(first)), t = ymd(new Date());
  const cellsN = Math.ceil((dow(first) + new Date(y, m + 1, 0).getDate()) / 7) * 7;
  let cells = '';
  for (let i = 0; i < cellsN; i++) {
    const d = addDays(start, i), k = ymd(d);
    const evs = [
      ...S.birthdays.filter(b => bdOn(b, d)).map(b => ({ title: b.name, icon: 'cake', style: '--c:#e0679a;--cs:#ffeef5' })),
      ...S.events.filter(e => e.date === k).sort(byTime).map(e => ({ title: e.title, style: catVars(e.cat) })),
    ];
    cells += `<button class="mcell ${d.getMonth() !== m ? 'out' : ''} ${k === t ? 'today' : ''}" data-act="pGoDay" data-date="${k}" aria-label="${fmtLong(d)}${evs.length ? ', ' + evs.length + ' actividades' : ''}">
      <span class="mnum">${d.getDate()}</span>
      ${evs.slice(0, 3).map(e => `<span class="mchip" style="${e.style}">${e.icon ? ic(e.icon) + ' ' : ''}${esc(e.title)}</span>`).join('')}
      ${evs.length > 3 ? `<span class="more">+${evs.length - 3} más</span>` : ''}</button>`;
  }
  return `<div class="month"><div class="mhead">${DIAS_C.map(d => `<span>${d}</span>`).join('')}</div><div class="mgrid">${cells}</div></div>`;
}

function renderHorario(root) {
  const mins = S.blocks.flatMap(b => [toMin(b.start), toMin(b.end)]);
  let h0 = 7, h1 = 22;
  if (mins.length) { h0 = Math.min(h0, Math.floor(Math.min(...mins) / 60)); h1 = Math.max(h1, Math.ceil(Math.max(...mins) / 60)); }
  const HH = 48, now = new Date(), today = dow(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const hours = []; for (let h = h0; h <= h1; h++) hours.push(h);
  const blockEl = b => {
    const s = toMin(b.start), e = toMin(b.end);
    return `<button class="blk" style="${catVars(b.cat)};top:${(s - h0 * 60) / 60 * HH}px;height:${Math.max(20, (e - s) / 60 * HH - 2)}px" data-act="blockEdit" data-id="${b.id}">
      <strong>${esc(b.title)}</strong><small>${b.start}–${b.end}${b.place ? ' · ' + esc(b.place) : ''}</small></button>`;
  };
  const totals = {};
  S.blocks.forEach(b => { totals[b.cat] = (totals[b.cat] || 0) + (toMin(b.end) - toMin(b.start)) / 60 * b.days.length; });
  const max = Math.max(1, ...Object.values(totals));
  root.innerHTML = `
    <div class="page-h">
      <div><h1>Mi horario semanal</h1><p class="sub">Tu semana típica. También aparece en el planner.</p></div>
      <button class="btn btn-primary" data-act="blockNew">${ic('plus')} Bloque</button>
    </div>
    <div class="card">
      <p class="hint">Toca un espacio vacío para crear un bloque a esa hora.</p>
      <div class="sched-scroll"><div class="sched" style="--hh:${HH}px;--rows:${h1 - h0}">
        <div class="sched-times">${hours.map(h => `<span style="top:${(h - h0) * HH}px">${pad(h)}:00</span>`).join('')}</div>
        ${DIAS_C.map((d, i) => `<div class="sched-col ${i === today ? 'today' : ''}">
          <div class="sched-h">${d}</div>
          <div class="sched-b" data-act="blockNewAt" data-day="${i}" data-h0="${h0}" data-hh="${HH}">
            ${S.blocks.filter(b => b.days.includes(i)).map(blockEl).join('')}
            ${i === today && nowMin >= h0 * 60 && nowMin <= h1 * 60 ? `<div class="now-line" style="top:${(nowMin - h0 * 60) / 60 * HH}px"></div>` : ''}
          </div></div>`).join('')}
      </div></div>
    </div>
    ${Object.keys(totals).length ? `<div class="card" style="margin-top:18px"><div class="card-h"><h2>Horas por semana</h2></div>
      ${Object.entries(totals).sort((a, b) => b[1] - a[1]).map(([k, h]) => `<div class="stat" style="${catVars(k)}"><span>${cat(k).label}</span><div class="bar"><span style="width:${100 * h / max}%"></span></div><em>${h.toLocaleString('es', { maximumFractionDigits: 1 })} h</em></div>`).join('')}
    </div>` : ''}`;
}

// Texto áureo: al escribir la referencia (ej. "Hechos 12:13") se trae el texto RVR1960 desde bolls.life (gratis, sin clave).
// Índice + 1 = número de libro en bolls.life. Nombres sin tildes ni espacios (ver bookKey).
const BIBLE_BOOKS = [
  'genesis gn gen', 'exodo ex exo', 'levitico lv lev', 'numeros nm num', 'deuteronomio dt deut', 'josue jos', 'jueces jue jc', 'rut rt',
  '1samuel 1s 1sa 1sam', '2samuel 2s 2sa 2sam', '1reyes 1r 1re 1rey', '2reyes 2r 2re 2rey', '1cronicas 1cr 1cro', '2cronicas 2cr 2cro', 'esdras esd',
  'nehemias neh', 'ester est', 'job jb', 'salmos salmo sal sl', 'proverbios pr pro prov', 'eclesiastes ec ecl',
  'cantares cantardeloscantares cnt cant', 'isaias is isa', 'jeremias jr jer', 'lamentaciones lm lam', 'ezequiel ez eze', 'daniel dn dan',
  'oseas os', 'joel jl', 'amos am', 'abdias abd', 'jonas jon', 'miqueas mi miq', 'nahum nah', 'habacuc hab', 'sofonias sof', 'hageo hag',
  'zacarias zac', 'malaquias mal', 'mateo mt mat', 'marcos mr mc mar', 'lucas lc luc', 'juan jn', 'hechos hch hech', 'romanos ro rom',
  '1corintios 1co 1cor', '2corintios 2co 2cor', 'galatas ga gal', 'efesios ef', 'filipenses fil flp', 'colosenses col', '1tesalonicenses 1ts 1tes',
  '2tesalonicenses 2ts 2tes', '1timoteo 1ti 1tim', '2timoteo 2ti 2tim', 'tito tit', 'filemon flm', 'hebreos he heb', 'santiago stg sant',
  '1pedro 1p 1pe 1ped', '2pedro 2p 2pe 2ped', '1juan 1jn', '2juan 2jn', '3juan 3jn', 'judas jud', 'apocalipsis ap apoc'];
const BOOK_ID = new Map(BIBLE_BOOKS.flatMap((s, i) => s.split(' ').map(n => [n, i + 1])));
const bookKey = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.ºª°]/g, '');
function parseRef(ref) {
  const m = String(ref).trim().match(/^(.+?)\s*(\d+)\s*[:.]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/);
  const book = m && BOOK_ID.get(bookKey(m[1]));
  if (!book) return null;
  const a = +m[3], b = m[4] ? +m[4] : a;
  return b >= a ? { book, ch: +m[2], a, b } : null;
}
const bibleCache = new Map();
async function fetchVerses(ref) {
  const r = parseRef(ref);
  if (!r) throw new Error('ref');
  const key = `${r.book}/${r.ch}`;
  if (!bibleCache.has(key)) bibleCache.set(key, fetch(`https://bolls.life/get-text/RV1960/${key}/`)
    .then(res => { if (!res.ok) throw new Error('net'); return res.json(); })
    .catch(e => { bibleCache.delete(key); throw e; }));
  const vs = (await bibleCache.get(key)).filter(v => v.verse >= r.a && v.verse <= r.b);
  if (!vs.length) throw new Error('ref');
  return vs.map(v => v.text.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '')).join(' ').replace(/\s+/g, ' ').trim();
}
async function fillGolden(l) {
  const id = l.id, ref = l.golden.trim(), msg = t => $$('[data-golden-msg]').forEach(e => e.textContent = t);
  const put = t => { l.goldenText = t; save(); $$('[data-f="goldenText"]').forEach(e => e.value = t); };
  if (!ref) { put(''); msg(''); return; }
  msg('Buscando el texto…');
  try {
    const text = await fetchVerses(ref);
    l = findById(S.lessons, id);
    if (!l || l.golden.trim() !== ref) return;
    put(text); msg('Texto RVR1960 traído de bolls.life. Puedes corregirlo.');
  } catch (e) {
    if (findById(S.lessons, id)?.golden.trim() !== ref) return;
    msg(e.message === 'ref' ? 'No reconocí la referencia. Escríbela como “Hechos 12:13” o “Juan 3:16-18”.' : 'No pude traer el texto (¿sin conexión?). Puedes escribirlo a mano.');
  }
}

function presentGo(d) {
  if (!present) return;

}
$('#present').addEventListener('click', e => {

  else if (a === 'next') presentGo(1);

const GASTO_CATS = { comida: ['Comida', 'fork-knife'], transporte: ['Transporte', 'bus'], casa: ['Casa y cuentas', 'house-line'], salud: ['Salud', 'first-aid'], ropa: ['Ropa y belleza', 't-shirt'],

// Saldo de la cuenta principal: parte del saldo fijado y suma o resta lo anotado después (hasta hoy).

const parseAmount = v => { const t = String(v ?? '').replace(/[\s$]/g, '').replace(/\./g, '').replace(',', '.'); return t === '' ? NaN : Number(t); };

const signed = n => `${n < 0 ? '−' : ''}${money(Math.abs(n))}`;
const isPastMv = m => m.date <= ymd(new Date());
const afterOpening = m => { const o = S.moneyCfg.opening; return !!o && isPastMv(m) && (m.date > o.date || (m.date === o.date && (m.created || 0) > o.at)); };
function mainBalance() {
  const o = S.moneyCfg.opening;
  if (!o) return null;
  let b = o.amount;
  S.money.forEach(m => { if (afterOpening(m)) b += m.type === 'ingreso' ? m.amount : -m.amount; });

const savMoves = a => S.savingsMoves.filter(m => m.accId === a.id).sort((x, y) => y.date.localeCompare(x.date) || (y.created || 0) - (x.created || 0));

const darkMq = matchMedia('(prefers-color-scheme: dark)');
function isDarkNow() {
  if (S.darkMode === 'dark') return true;
  if (S.darkMode === 'light') return false;
  if (S.darkMode === 'schedule') {
    const n = new Date(), m = n.getHours() * 60 + n.getMinutes(), a = toMin(S.darkFrom) ?? 1200, b = toMin(S.darkTo) ?? 420;
    return a <= b ? m >= a && m < b : m >= a || m < b;
  }
  return darkMq.matches;
}
function applyMode() {
  const dark = isDarkNow(), html = document.documentElement, mode = dark ? 'dark' : 'light';
  const b = $('[data-act="toggleDark"]');
  if (b && b.dataset.mode !== mode) {
    b.dataset.mode = mode;
    b.innerHTML = `<span class="ic">${ic(dark ? 'sun' : 'moon-stars', 'duotone')}</span><span>${dark ? 'Modo día' : 'Modo noche'}</span>`;
  }
  if (html.dataset.mode === mode) return;
  html.dataset.mode = mode;
  $('meta[name="theme-color"]')?.setAttribute('content', dark ? '#1f141c' : '#fbd0e1');
}
darkMq.addEventListener?.('change', applyMode);
function applyDecor() {
  document.documentElement.dataset.theme = S.theme;
  applyMode();
  document.documentElement.style.setProperty('--veil', (S.veil / 100).toFixed(2));
  const bg = $('#bgPhoto'), d = S.bgId && IMG.get(S.bgId);
  bg.style.backgroundImage = d ? `url("${d}")` : '';
  bg.classList.toggle('on', !!d);
}

const AW_CRIT = [['a', 'Asistencia', 'user-check'], ['p', 'Puntualidad', 'clock'], ['v', 'Versículo', 'book-bookmark'], ['b', 'Biblia', 'book-open'], ['c', 'Participación', 'chat-circle-dots']];

const awPts = m => m ? AW_CRIT.reduce((n, [k]) => n + (m[k] ? 1 : 0), 0) : 0;

function awStats(year) {
  const days = awDays().filter(d => d.startsWith(year + '-'));
  const months = [...new Set(days.map(d => Number(d.slice(5, 7)) - 1))].sort((a, b) => a - b);
  const per = new Map(S.awards.students.map(st => [st.id, { s: st, total: 0, months: {}, crit: { a: 0, p: 0, v: 0, b: 0, c: 0 }, mc: {} }]));
  days.forEach(d => {
    const m = Number(d.slice(5, 7)) - 1;
    for (const [sid, mk] of Object.entries(S.awards.days[d])) {
      const r = per.get(sid);
      if (!r) continue;
      const pts = awPts(mk);
      r.total += pts; r.months[m] = (r.months[m] || 0) + pts;
      r.mc[m] = r.mc[m] || { a: 0, p: 0, v: 0, b: 0, c: 0 };
      AW_CRIT.forEach(([k]) => { if (mk[k]) { r.crit[k]++; r.mc[m][k]++; } });
    }
  });
  return { days, months, rows: [...per.values()] };
}

  toast({ title: added.length ? `${added.length} ${added.length === 1 ? 'alumna agregada' : 'alumnas agregadas'}` : 'No se agregó ninguna', text: skipped ? `${skipped} ya estaban en la lista.` : '', icon: 'users-three' });
};

/* ---------- Versículos (memorización) ---------- */
const VS_INTERVALS = [0, 1, 2, 4, 7, 14, 30];   // días hasta el próximo repaso según el nivel
const VS_STATUS = { aprendiendo: 'Aprendiendo', casi: 'Casi', memorizado: 'Memorizado' };
const vsStatus = v => v.box >= 4 ? 'memorizado' : v.box >= 2 ? 'casi' : 'aprendiendo';
const vsDue = v => !v.due || v.due <= ymd(new Date());
const vsNorm = w => w.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const vsRefKey = r => vsNorm(r);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let vsFilter = 'todos', vsTag = null, practice = null;
const vsTokens = text => text.trim().split(/\s+/).map(t => {
  const m = t.match(/^([¡¿"'«(“‘]*)(.*?)([.,;:!?"'»)”’]*)$/);
  return { pre: m[1], word: m[2], post: m[3] };
});
function vsStreak() {
  const set = new Set(S.verseLog);
  let d = todayStart(), n = 0;
  if (!set.has(ymd(d))) d = addDays(d, -1);
  while (set.has(ymd(d))) { n++; d = addDays(d, -1); }
  return n;
}
const vsWhen = v => {
  if (vsDue(v)) return 'Repasar hoy';
  const n = Math.round((fromYmd(v.due) - todayStart()) / 864e5);
  return n === 1 ? 'Repasar mañana' : `Repasar en ${n} días`;
};
function vsGrade(v, r) {
  const t = ymd(new Date());
  if (r === 'hard') v.box = 0;
  else if (r === 'mid') v.box = Math.max(1, v.box);
  else v.box = Math.min(6, v.box + 1);
  v.due = ymd(addDays(todayStart(), r === 'good' ? VS_INTERVALS[v.box] : 1));
  v.reviews = (v.reviews || 0) + 1; v.last = t;
  if (!S.verseLog.includes(t)) S.verseLog.push(t);
  save();
}

      const dup = S.verses.find(y => y !== v && vsRefKey(y.ref) === vsRefKey(obj.ref));

function startPractice(ids) {
  if (!ids.length) return;
  practice = { queue: ids, i: 0, reveal: false, checked: null, answers: null, hidden: null, res: { hard: 0, mid: 0, good: 0 }, retry: new Set() };
  drawPractice();
  $('#practice').showModal();

}
function drawPractice() {
  const P = practice, dlg = $('#practice');
  const top = (mid = '') => `<div class="present-top"><span class="present-time">${Math.min(P.i + 1, P.queue.length)} / ${P.queue.length}</span>${mid}
    <button class="icon-btn" data-act="pxClose" aria-label="Cerrar">${ic('x')}</button></div>`;
  if (P.i >= P.queue.length) {

    dlg.innerHTML = `<div class="present-in">${top()}<div class="slide">

  else if (mode === 'letras') body = `<p class="slide-body px-verse ${P.reveal ? '' : 'px-letters'}">${P.reveal ? esc(v.text) : toks.map(t => esc(t.pre + (t.word[0] || '') + t.post)).join(' ')}</p>`;
  else {
    if (!P.hidden) {
      const idx = shuffle(toks.map((t, i) => i).filter(i => vsNorm(toks[i].word).length >= 3));
      P.hidden = new Set(idx.slice(0, Math.max(1, Math.round(idx.length * 0.4))));

      return `${esc(t.pre)}<input class="px-gap ${st}" data-i="${i}" size="${Math.max(3, t.word.length)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Palabra ${i + 1}" ${P.checked ? 'readonly' : ''} value="${P.checked ? esc(P.answers[i] || '') : ''}">${P.checked && !P.checked[i] ? `<small class="px-fix">${esc(t.word)}</small>` : ''}${esc(t.post)}`;
    }).join(' ')}</p>`;
  }
  const done = mode === 'completar' ? !!P.checked : P.reveal;
  const keys = Object.keys(P.checked || {});
  const score = P.checked && keys.length ? keys.filter(k => P.checked[k]).length / keys.length : null;
  const sug = score == null ? 'good' : score >= .9 ? 'good' : score >= .6 ? 'mid' : 'hard';
  const rate = [['hard', 'Me costó', 'smiley-nervous', 1], ['mid', 'Casi', 'smiley-meh', 2], ['good', 'La sé', 'smiley', 3]];
  const actions = done
    ? `<div class="btns center px-rate">${rate.map(([k, l, i, n]) => `<button class="btn ${sug === k ? 'btn-primary' : ''}" data-act="pxRate" data-r="${k}">${ic(i)} ${l}<small>${n}</small></button>`).join('')}</div>
       ${score != null ? `<p class="hint" style="text-align:center;margin-top:8px">${Math.round(score * 100)}% correcto</p>` : ''}`
    : `<div class="btns center">${mode === 'completar'
        ? `<button class="btn btn-primary" data-act="pxCheck">${ic('check')} Revisar</button>`
        : `<button class="btn btn-primary" data-act="pxReveal">${ic('eye')} Mostrar versículo</button>`}</div>`;
  dlg.innerHTML = `<div class="present-in">${top(modes)}
    <div class="slide"><div class="slide-k">${VS_STATUS[vsStatus(v)]}${v.version ? ' · ' + esc(v.version) : ''}</div><h2 class="slide-t">${esc(v.ref)}</h2>${body}</div>

/* ---------- Hábitos ---------- */
const HB_ICONS = 'drop book-open hands-praying barbell person-simple-run moon-stars bed bowl-food pill tooth music-notes pencil-simple broom sun heart leaf coffee brain wallet flower-lotus'.split(' ');
let hDate = null, hMonth = null;
const hbGoal = h => Math.max(1, Number(h.goal) || 1);
const hbCount = (h, k) => (S.habitLog[k] && S.habitLog[k][h.id]) || 0;
const hbDone = (h, k) => hbCount(h, k) >= hbGoal(h);
const hbScheduled = (h, d) => h.freq.type !== 'days' || h.freq.days.includes(dow(d));
const hbFreqLabel = h => h.freq.type === 'daily' ? 'Todos los días'
  : h.freq.type === 'days' ? h.freq.days.map(i => DIAS_C[i]).join(', ')
  : `${h.freq.times} ${h.freq.times === 1 ? 'vez' : 'veces'} por semana`;
function hbStart(h) {
  const first = Object.keys(S.habitLog).filter(k => S.habitLog[k][h.id]).sort()[0];
  const c = h.created || ymd(new Date());
  return first && first < c ? first : c;
}
function hbSet(h, k, n) {
  const day = S.habitLog[k] = S.habitLog[k] || {};
  if (n > 0) day[h.id] = n; else delete day[h.id];
  if (!Object.keys(day).length) delete S.habitLog[k];
  save();
}
function hbWeekDone(h, d) {
  const s = startOfWeek(d);
  let n = 0;
  for (let i = 0; i < 7; i++) if (hbDone(h, ymd(addDays(s, i)))) n++;
  return n;
}
// Se comparan claves YYYY-MM-DD (no objetos Date) para no fallar con el cambio de horario.
function hbStreaks(h) {
  const tk = ymd(new Date());
  let run = 0, best = 0;
  if (h.freq.type === 'weekly') {
    const curW = ymd(startOfWeek(new Date()));
    for (let w = startOfWeek(fromYmd(hbStart(h))); ymd(w) <= curW; w = addDays(w, 7)) {
      const ok = hbWeekDone(h, w) >= h.freq.times;
      if (ok) { run++; best = Math.max(best, run); } else if (ymd(w) !== curW) run = 0;
    }
    return { cur: run, best, unit: run === 1 ? 'semana' : 'semanas' };
  }
  for (let d = fromYmd(hbStart(h)); ymd(d) <= tk; d = addDays(d, 1)) {
    if (!hbScheduled(h, d)) continue;
    const k = ymd(d);
    if (hbDone(h, k)) { run++; best = Math.max(best, run); } else if (k !== tk) run = 0;
  }
  return { cur: run, best, unit: run === 1 ? 'día' : 'días' };
}
function hbRate(h, from, to) {
  const tk = ymd(new Date()), st = hbStart(h), end = ymd(to) < tk ? ymd(to) : tk;
  let d = ymd(from) < st ? fromYmd(st) : new Date(from);
  let sched = 0, done = 0, days = 0;
  for (; ymd(d) <= end; d = addDays(d, 1)) {
    const k = ymd(d);
    if (h.freq.type === 'weekly') { days++; if (hbDone(h, k)) done++; continue; }
    if (!hbScheduled(h, d) || (k === tk && !hbDone(h, k))) continue;
    sched++; if (hbDone(h, k)) done++;
  }
  if (h.freq.type === 'weekly') { const expected = h.freq.times * days / 7; return expected ? Math.min(1, done / expected) : null; }
  return sched ? done / sched : null;
}

function hbRow(h, k) {
  const c = hbCount(h, k), g = hbGoal(h), done = c >= g, st = hbStreaks(h);
  const week = h.freq.type === 'weekly' ? ` · ${hbWeekDone(h, fromYmd(k))}/${h.freq.times} esta semana` : '';
  return `<div class="habit ${done ? 'done' : ''}" style="--hc:${h.color}">
    <button class="hb-check" data-act="hbTap" data-id="${h.id}" data-k="${k}" aria-pressed="${done}" aria-label="${esc(h.name)}: ${g > 1 ? `${c} de ${g}` : done ? 'cumplido' : 'pendiente'}">${done ? ic('check') : g > 1 ? `<span>${c}/${g}</span>` : ic(h.icon, 'duotone')}</button>
    <div class="hb-b"><strong>${esc(h.name)}</strong><span class="lesson-meta">${hbFreqLabel(h)}${week}${h.remind ? ` · ${ic('bell')} ${h.remind}` : ''}</span></div>
    <span class="hb-streak" title="Racha actual. Mejor racha: ${st.best}">${ic('fire', st.cur ? 'fill' : '')} ${st.cur}</span>
    ${g > 1 && c > 0 ? `<button class="icon-btn" data-act="hbMinus" data-id="${h.id}" data-k="${k}" aria-label="Restar uno">${ic('minus')}</button>` : ''}
    <button class="icon-btn" data-act="hbEdit" data-id="${h.id}" aria-label="Editar hábito">${ic('pencil-simple')}</button>
  </div>`;
}
function hbCal(h) {
  const y = hMonth.getFullYear(), m = hMonth.getMonth(), first = new Date(y, m, 1), nDays = new Date(y, m + 1, 0).getDate();
  const tk = ymd(new Date()), st = hbStreaks(h), start = hbStart(h), g = hbGoal(h);
  const rate = hbRate(h, first, new Date(y, m, nDays)), wk = hbRate(h, startOfWeek(new Date()), new Date());
  const pct = r => r == null ? '—' : Math.round(r * 100) + '%';
  let cells = '<i></i>'.repeat(dow(first));
  for (let i = 1; i <= nDays; i++) {
    const d = new Date(y, m, i), k = ymd(d), c = hbCount(h, k);
    const cls = k > tk ? 'fut' : c >= g ? 'on' : c > 0 ? 'part'
      : (h.freq.type !== 'weekly' && hbScheduled(h, d) && k !== tk && k >= start ? 'miss' : '');
    cells += `<button class="hc ${cls}" data-act="hbCell" data-id="${h.id}" data-k="${k}" ${k > tk ? 'disabled' : ''} title="${shortDate(k)}${g > 1 ? ` · ${c}/${g}` : c >= g ? ' · cumplido' : ''}">${i}</button>`;
  }
  return `<section class="card hb-cal" style="--hc:${h.color}">
    <div class="card-h" style="margin-bottom:8px"><h3>${ic(h.icon, 'duotone')} ${esc(h.name)}</h3></div>
    <div class="hb-stats"><span><b>${st.cur}</b>racha</span><span><b>${st.best}</b>mejor</span><span><b>${pct(wk)}</b>semana</span><span><b>${pct(rate)}</b>mes</span></div>
    <div class="hc-grid">${DIAS_C.map(x => `<span>${x[0]}</span>`).join('')}${cells}</div>
  </section>`;
}
function renderHabitos(root) {
  const tk = ymd(new Date());
  if (!hDate || hDate > tk) hDate = tk;
  if (!hMonth) hMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const d = fromYmd(hDate), isToday = hDate === tk;

  if (!web) return `${head}<p class="hint" style="margin-top:8px">Configuración guardada (proyecto <code>${esc(syncMeta.config.projectId)}</code>). Para iniciar sesión abre Convalaria desde su dirección web (p0llou.github.io/convalaria o http://localhost), no como archivo.</p>${forget}`;
  if (!fb) return `${head}<p class="sync-status ${syncState === 'error' ? 'err' : ''}">${syncState === 'error' ? `${ic('cloud-warning')} No pude cargar Firebase: ${esc(syncErr)}` : 'Cargando…'}</p>${forget}`;
  if (!syncUser) return `${head}
    <p class="hint" style="margin-top:8px">Inicia sesión para sincronizar. Usa la misma cuenta en todos tus dispositivos.</p>
    ${syncState === 'error' ? `<p class="sync-status err">${ic('cloud-warning')} ${esc(syncErr)}</p>` : ''}
    <div class="btns"><button class="btn btn-primary" data-act="fbGoogle">${ic('google-logo')} Entrar con Google</button></div>
    <form data-form="fbEmail" style="margin-top:14px">
      <div class="row2"><label class="fld"><span>Correo</span><input type="email" name="email" required autocomplete="email"></label>
        <label class="fld"><span>Contraseña</span><input type="password" name="pass" required minlength="6" autocomplete="current-password"></label></div>
      <div class="btns" style="margin-top:10px"><button class="btn" name="mode" value="in">Entrar con correo</button><button class="btn" name="mode" value="up">Crear cuenta</button>
        <button type="button" class="btn btn-sm" data-act="fbReset">Olvidé mi contraseña</button></div>
    </form>
    <div style="margin-top:12px">${forget}</div>`;
  return `${head}
    <p class="hint" style="margin-top:8px">Conectada como <strong>${esc(syncUser.email || syncUser.displayName || 'tu cuenta')}</strong> · proyecto <code>${esc(syncMeta.config.projectId)}</code></p>
    <p class="sync-status ${syncState === 'error' ? 'err' : ''}" data-sync>${syncStatusText()}</p>
    <div class="btns"><button class="btn btn-primary" data-act="fbSyncNow">${ic('arrows-clockwise')} Sincronizar ahora</button>
      <button class="btn" data-act="fbSignOut">${ic('sign-out')} Cerrar sesión</button></div>`;
}
Object.assign(ACT, {
  fbGoogle: async () => {
    try {
      const prov = new fb.a.GoogleAuthProvider();
      try { await fb.a.signInWithPopup(fb.auth, prov); }
      catch (e) { if (e.code === 'auth/popup-blocked') await fb.a.signInWithRedirect(fb.auth, prov); else throw e; }
    } catch (e) { setSync('error', e); renderSyncCard(); }
  },
  fbReset: async () => {
    const email = $('[data-form="fbEmail"] [name=email]')?.value.trim();
    if (!email) { toast({ title: 'Escribe tu correo primero', icon: 'envelope-simple' }); return; }
    try { await fb.a.sendPasswordResetEmail(fb.auth, email); toast({ title: 'Te enviamos un correo', text: 'Sigue el enlace para crear una contraseña nueva.', icon: 'envelope-simple' }); }
    catch (e) { toast({ title: 'No se pudo enviar', text: fbMsg(e), icon: 'warning' }); }
  },
  fbSyncNow: async () => { await pushNow(); await fetchPhotos(); },
  fbSignOut: async () => {
    if (!confirm('¿Cerrar sesión? Tus datos siguen en este dispositivo y en la nube.')) return;
    await fb.a.signOut(fb.auth);
  },
  fbForget: async () => {
    if (!confirm('¿Quitar la conexión con Firebase? Tus datos siguen en este dispositivo.')) return;
    try { if (fb && syncUser) await fb.a.signOut(fb.auth); } catch {}
    syncMeta = { device: syncMeta.device }; saveMeta();
    if (fb) { toast({ title: 'Configuración quitada', text: 'Recarga la página para terminar.', icon: 'plug' }); }
    fb = null; syncUser = null; setSync('idle'); renderSyncCard();
  },
});
Object.assign(FORMS, {
  fbConfig: f => {
    const cfg = parseFbConfig(f.elements.cfg.value);
    if (!cfg) { toast({ title: 'No reconozco esa configuración', text: 'Pega el bloque firebaseConfig completo, con apiKey, authDomain y projectId.', icon: 'warning' }); return; }
    syncMeta.config = cfg; saveMeta(); renderSyncCard(); fbLoad();
  },
  fbEmail: async (f, btn) => {
    const email = f.elements.email.value.trim(), pass = f.elements.pass.value;
    try {
      if (btn?.value === 'up') await fb.a.createUserWithEmailAndPassword(fb.auth, email, pass);
      else await fb.a.signInWithEmailAndPassword(fb.auth, email, pass);
    } catch (e) { setSync('error', e); renderSyncCard(); }
  },
});
fbLoad();

/* ---------- Búsqueda global ---------- */
const sNorm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let searchRes = [], searchActive = 0;
function snippet(text, tok) {
  const t = String(text).replace(/\s+/g, ' '), i = sNorm(t).indexOf(tok);
  if (i < 0) return esc(t.length > 90 ? t.slice(0, 90) + '…' : t);
  const a = Math.max(0, i - 36), b = Math.min(t.length, i + tok.length + 54);
  return (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + tok.length)) + '</mark>' + esc(t.slice(i + tok.length, b)) + (b < t.length ? '…' : '');
}
function flash(id) {
  const el = $(`#view-${current} [data-id="${id}"]`)?.closest('li, .card, section');
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
const searchSources = () => [
  { label: 'Actividades', icon: 'calendar-blank', items: () => S.events.map(e => ({ title: e.title, sub: `${shortDate(e.date)}${e.time ? ' · ' + e.time : ''} · ${cat(e.cat).label}`, fields: [e.title, e.notes],
      open: () => { pDate = fromYmd(e.date); S.plannerView = 'dia'; go('planner'); eventModal(e); } })) },
  { label: 'Horario', icon: 'clock', items: () => S.blocks.map(b => ({ title: b.title, sub: `${b.days.map(i => DIAS_C[i]).join(', ')} · ${b.start}–${b.end}`, fields: [b.title, b.place],
      open: () => { go('horario'); blockModal(b); } })) },
  { label: 'Clases', icon: 'book-open-text', items: () => S.lessons.map(l => ({ title: l.title || 'Clase sin título', sub: [l.date ? shortDate(l.date) : 'Sin fecha', l.reading].filter(Boolean).join(' · '),
      fields: [l.title, l.reading, l.golden, l.goldenText, l.passage, l.objective, l.development, l.truth, l.notes, l.group, l.reflection],
      open: () => { lessonOpen = l.id; go('estudio'); } })) },
  { label: 'Versículos', icon: 'cards', items: () => S.verses.map(v => ({ title: v.ref, sub: VS_STATUS[vsStatus(v)], fields: [v.ref, v.text, (v.tags || []).join(' ')],
      open: () => { go('versiculos'); vsModal(v); } })) },
  { label: 'Prédicas y estudios', icon: 'notebook', items: () => S.sermons.map(x => ({ title: x.title, sub: [x.date ? shortDate(x.date) : '', x.passage, x.speaker].filter(Boolean).join(' · '),
      fields: [x.title, x.passage, x.speaker, x.text], open: () => { go('iglesia'); sermonModal(x); } })) },
  { label: 'Oración', icon: 'hands-praying', items: () => S.prayers.map(p => ({ title: p.text, sub: p.answered ? 'Respondida' : 'Pendiente', fields: [p.text],
      open: () => { go('iglesia'); flash(p.id); } })) },
  { label: 'Pendientes de iglesia', icon: 'list-checks', items: () => S.churchTodos.map(t => ({ title: t.text, sub: t.done ? 'Hecho' : 'Pendiente', fields: [t.text],
      open: () => { go('iglesia'); flash(t.id); } })) },
  { label: 'Alumnas', icon: 'student', items: () => S.awards.students.map(st => ({ title: st.name, sub: st.active === false ? 'Archivada' : 'Plan de premios', fields: [st.name],
      open: () => { awTab = 'alumnas'; go('premios'); awStudentModal(st); } })) },
  { label: 'Cumpleaños', icon: 'cake', items: () => S.birthdays.map(b => ({ title: b.name, sub: `${b.day} de ${MESES[b.month - 1]}`, fields: [b.name, b.notes],
      open: () => { go('cumples'); bdModal(b); } })) },
  { label: 'Lugares', icon: 'map-pin', items: () => S.places.map(p => ({ title: p.name, sub: p.address || (PLACE_CATS[p.cat] || PLACE_CATS.otro)[0], fields: [p.name, p.address, p.notes],
      open: () => { mapView = { c: [p.lat, p.lng], z: 17 }; go('lugares'); setTimeout(() => placeMarkers.get(p.id)?.openPopup(), 900); } })) },
  { label: 'Finanzas', icon: 'wallet', items: () => S.money.map(m => ({ title: m.note || mvCat(m)[0], sub: `${shortDate(m.date)} · ${m.type === 'ingreso' ? '+' : '−'}${money(m.amount)}`, fields: [m.note, mvCat(m)[0]],
      open: () => { const d = fromYmd(m.date); finMonth = new Date(d.getFullYear(), d.getMonth(), 1); go('finanzas'); mvModal(m); } })) },
  { label: 'Me deben', icon: 'hand-coins', items: () => S.owed.map(o => ({ title: o.what, sub: `${o.who} · ${money(o.amount)} · ${o.paid ? 'Pagado' : 'Pendiente'}`, fields: [o.what, o.who],
      open: () => { go('finanzas'); owModal(o); } })) },
  { label: 'Ahorros', icon: 'piggy-bank', items: () => S.savings.map(a => ({ title: a.name, sub: `Ahorro · ${signed(savBalance(a))}`, fields: [a.name],
      open: () => { go('finanzas'); flash(a.id); } })) },
  { label: 'Mapas mentales', icon: 'brain', items: () => S.mindmaps.flatMap(m => [
      { title: m.title, sub: `${m.nodes.length} ideas`, fields: [m.title], open: () => { mmOpen = m.id; mmSel = null; mmZoom = 1; go('ideas'); } },
      ...m.nodes.map(n => ({ title: n.text, sub: m.title, fields: [n.text], open: () => {
        mmOpen = m.id; mmSel = n.id; mmZoom = 1; go('ideas');
        const w = $('[data-mm]'); if (w) { w.scrollLeft = n.x - w.clientWidth / 2; w.scrollTop = n.y - w.clientHeight / 2; }
      } })),
    ]) },
  { label: 'Hábitos', icon: 'plant', items: () => S.habits.map(h => ({ title: h.name, sub: hbFreqLabel(h), fields: [h.name], open: () => { go('habitos'); hbModal(h); } })) },
  { label: 'Recordatorios', icon: 'bell', items: () => S.reminders.map(r => ({ title: r.text, sub: fmtWhen(r.at), fields: [r.text], open: () => { go('inicio'); flash(r.id); } })) },
  { label: 'Notas', icon: 'note', items: () => [
      S.note.trim() && { title: 'Nota rápida', sub: 'Inicio', fields: [S.note], open: () => { go('inicio'); $('[data-inp="note"]')?.focus(); } },
      S.verse.text.trim() && { title: S.verse.ref || 'Versículo de la semana', sub: 'Versículo de la semana', fields: [S.verse.text, S.verse.ref], open: () => go('iglesia') },
      ...S.board.filter(b => b.type === 'note').map(b => ({ title: b.text, sub: 'Nota del tablero', fields: [b.text], open: () => { boardSel = b.id; go('inicio'); } })),
    ].filter(Boolean) },
];
function runSearch(q) {
  const box = $('#srResults'), toks = sNorm(q).trim().split(/\s+/).filter(Boolean);
  searchRes = []; searchActive = 0;
  if (!toks.length) { box.innerHTML = '<p class="hint sr-empty">Busca en actividades, clases, versículos, alumnas, lugares, cumpleaños, finanzas, mapas y más.</p>'; return; }
  let html = '';
  for (const src of searchSources()) {
    const hits = [];
    for (const it of src.items()) {
      const fields = it.fields.filter(Boolean).map(String), hay = sNorm(fields.join(' · '));
      if (!toks.every(t => hay.includes(t))) continue;
      const inTitle = sNorm(it.title).includes(toks[0]);
      hits.push({ ...it, icon: src.icon, score: toks.every(t => sNorm(it.title).includes(t)) ? 2 : 1,
        titleHtml: inTitle ? snippet(it.title, toks[0]) : esc(it.title),
        snip: inTitle ? '' : snippet(fields.find(f => sNorm(f).includes(toks[0])) || '', toks[0]) });
    }
    if (!hits.length) continue;
    hits.sort((a, b) => b.score - a.score);
    html += `<div class="sr-g">${src.label}${hits.length > 6 ? ` · ${hits.length}` : ''}</div>`;
    hits.slice(0, 6).forEach(h => {
      const i = searchRes.push(h) - 1;
      html += `<button class="sr-item ${i === 0 ? 'on' : ''}" data-act="srOpen" data-i="${i}" role="option" aria-selected="${i === 0}">${ic(h.icon, 'duotone')}
        <span class="sr-b"><strong>${h.titleHtml}</strong><small>${esc(h.sub)}</small>${h.snip ? `<span class="sr-snip">${h.snip}</span>` : ''}</span></button>`;
    });
  }
  box.innerHTML = html || `<p class="hint sr-empty">Nada coincide con “${esc(q.trim())}”.</p>`;
}
function srMove(d) {
  const items = $$('#srResults .sr-item');
  if (!items.length) return;
  searchActive = (searchActive + d + items.length) % items.length;
  items.forEach((b, i) => { b.classList.toggle('on', i === searchActive); b.setAttribute('aria-selected', i === searchActive); });
  items[searchActive].scrollIntoView({ block: 'nearest' });
}
function openSearch() {
  const d = $('#search');
  if (d.open) return;
  if (modal.open) modal.close();
  d.showModal();
  const inp = $('#srInput');
  inp.value = ''; runSearch(''); inp.focus();
}
$('#search').addEventListener('click', e => { if (e.target === $('#search')) $('#search').close(); });
if (/Mac|iPhone|iPad/.test(navigator.platform)) { $('.nav-search .kbd').textContent = '⌘K'; $('.nav-search').setAttribute('aria-label', 'Buscar (⌘K)'); }
ACT.search = () => openSearch();
ACT.toggleDark = () => { S.darkMode = isDarkNow() ? 'light' : 'dark'; save(); applyMode(); if (current === 'decorar') renderAll(); };
ACT.darkMode = el => { S.darkMode = el.dataset.m; save(); applyMode(); renderAll(); };
CHG.darkFrom = el => { if (el.value) { S.darkFrom = el.value; save(); applyMode(); } };
CHG.darkTo = el => { if (el.value) { S.darkTo = el.value; save(); applyMode(); } };
ACT.srOpen = el => { const r = searchRes[Number(el.dataset.i)]; $('#search').close(); r && r.open(); };
INP.search = el => runSearch(el.value);
document.addEventListener('keydown', e => {
  const sd = $('#search');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); sd.open ? sd.close() : openSearch(); return; }
  if (sd.open) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); srMove(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter' && e.target.id === 'srInput') { e.preventDefault(); ($('.sr-item.on', sd) || $('.sr-item', sd))?.click(); }
    return;
  }
  if (e.key === '/' && !e.target.closest('input, textarea, select, [contenteditable="true"]') && !modal.open && !$('#present').open && !$('#practice').open) {
    e.preventDefault(); openSearch();
  }
});

document.addEventListener('keydown', e => {
  if ($('#practice').open && practice) {
    const d = $('#practice');
    if (e.target.matches('.px-gap:not([readonly])')) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const gaps = $$('.px-gap', d), i = gaps.indexOf(e.target);
        if (i < gaps.length - 1) gaps[i + 1].focus(); else ACT.pxCheck();
      }
      return;
    }
    const map = { 1: 'hard', 2: 'mid', 3: 'good' };
    if (map[e.key]) { const b = $(`[data-act="pxRate"][data-r="${map[e.key]}"]`, d); if (b) { e.preventDefault(); b.click(); } }
    else if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) {
      const b = $('[data-act="pxReveal"], [data-act="pxCheck"]', d); if (b) { e.preventDefault(); b.click(); }
    }
    return;
  }
  if ($('#present').open && present) {
    if (e.key === ' ' && e.target.closest('button')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); presentGo(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); presentGo(-1); }
    return;
  }
  if (current !== 'ideas' || !curMap() || mmEditing || modal.open) return;
  if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (e.target !== document.body && !e.target.closest('[data-mm]')) return;
  if (e.key === 'Tab') { e.preventDefault(); mmAdd('child'); }
  else if (e.key === 'Enter') { e.preventDefault(); mmAdd('sib'); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && mmSel) { e.preventDefault(); mmDelete(); }
  else if (e.key === 'F2') { e.preventDefault(); ACT.mmEdit(); }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]');
  if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form] && FORMS[f.dataset.form](f, e.submitter);
});

/* ---------- PWA ---------- */
let installPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (current === 'decorar') renderAll(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast({ title: 'App instalada', text: 'Ya puedes abrir Convalaria desde tu pantalla de inicio.', icon: 'check-circle' }); if (current === 'decorar') renderAll(); });
ACT.install = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  try { await installPrompt.userChoice; } catch {}
  installPrompt = null; renderAll();
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

(async function init() {
  applyDecor();
  await Promise.all(allImgIds().map(id => imgStore.get(id)));
  applyDecor();
  go(current);
  tick();
  setInterval(tick, 200);
