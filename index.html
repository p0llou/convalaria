<script>
  // Aplica tema y modo noche antes de pintar, para evitar un destello claro.
  try {
    const s = JSON.parse(localStorage.getItem('mi-espacio-v1') || '{}'), m = s.darkMode || 'auto', h = document.documentElement;
    let d = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (m === 'schedule') {
      const t = x => { const [a, b] = String(x).split(':').map(Number); return a * 60 + b; };
      const n = new Date(), x = n.getHours() * 60 + n.getMinutes(), a = t(s.darkFrom || '20:00'), b = t(s.darkTo || '07:00');
      d = a <= b ? x >= a && x < b : x >= a || x < b;
    }
    h.dataset.mode = d ? 'dark' : 'light';
    if (s.theme) h.dataset.theme = s.theme;
  } catch (e) {}
</script>

<style>
  :root {
    --bg: #fff6f9; --surface: rgba(255,255,255,.9); --surface-solid: #fff;
    --ink: #4b3942; --muted: #977f8b; --line: #f3d6e2;
    --accent: #ec7fa9; --accent-strong: #cf5a8a; --accent-soft: #fde4ee; --accent-softer: #fff4f8;
    --danger: #c94b58; --shadow: 0 10px 30px -14px rgba(207,90,138,.35);
    --on-accent: #fff; --paper: #fffdfa; --good: #2c7457; --mm-root: var(--accent-strong);
    --radius: 22px; --veil: .55;
    --font-display: 'Maloney', 'Bambi Bold', 'Bambi', 'Bambi Retro', 'Fraunces', Georgia, serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }
  [data-theme="lavanda"] { --bg:#f9f6ff; --ink:#433a52; --muted:#8a819c; --line:#e4dcf6; --accent:#a98ee8; --accent-strong:#7d5fcf; --accent-soft:#ece5fb; --accent-softer:#f8f5ff; --shadow:0 10px 30px -14px rgba(125,95,207,.35); }
  [data-theme="durazno"] { --bg:#fff8f4; --ink:#4d3b33; --muted:#9a8176; --line:#f6dccf; --accent:#f4a27c; --accent-strong:#d4724a; --accent-soft:#fde7dc; --accent-softer:#fff6f1; --shadow:0 10px 30px -14px rgba(212,114,74,.35); }
  [data-theme="menta"] { --bg:#f5fcf9; --ink:#34463f; --muted:#76908a; --line:#cfeadf; --accent:#6cc4a4; --accent-strong:#3a9674; --accent-soft:#dcf3ea; --accent-softer:#f3fbf8; --shadow:0 10px 30px -14px rgba(58,150,116,.35); }
  [data-theme="lirio"] { --bg:#fbfaf5; --ink:#3f3a3d; --muted:#86808a; --line:#dfe9dc; --accent:#e58fb3; --accent-strong:#c4598a; --accent-soft:#f7e3ec; --accent-softer:#fdf7f9; --shadow:0 10px 30px -14px rgba(111,174,134,.4); }
  [data-theme="nube"] { --bg:#f6faff; --ink:#35404f; --muted:#7a8799; --line:#d6e6f7; --accent:#7fb3e8; --accent-strong:#4a84c4; --accent-soft:#e1eefb; --accent-softer:#f5f9ff; --shadow:0 10px 30px -14px rgba(74,132,196,.35); }

  *, *::before, *::after { box-sizing: border-box; }
  html { font-family: var(--font-body); color: var(--ink); }
  .display, h1, h2, h3, .brand, .hero-hi, .hero-clock, .ring-t, .tmr-t, .sw-t, .tile strong, .acct-amt, .mini-focus .t, .mm-node.root, .slide-t, .tithe strong {
    font-family: var(--font-display); font-weight: 800; font-variation-settings: 'SOFT' 100, 'WONK' 1; letter-spacing: -.005em; }
  .ph, .ph-duotone, .ph-fill { line-height: 1; vertical-align: -.14em; }
  .btn .ph, .btn .ph-duotone, .btn .ph-fill { font-size: 1.15em; margin-right: 2px; }
  .icon-btn .ph { font-size: 20px; vertical-align: 0; }
  body {
    margin: 0; min-height: 100vh; font-weight: 500; line-height: 1.45;
    background-color: var(--bg);
    background-image: radial-gradient(var(--line) 1.1px, transparent 1.5px);
    background-size: 22px 22px;
  }
  :focus-visible { outline: 2.5px solid var(--accent-strong); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; line-height: 1.2; }

  .bg-photo { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; display: none; }
  .bg-photo.on { display: block; }
  .bg-photo::after { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: var(--veil); }

  /* Layout */
  .app { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .nav {
    position: sticky; top: 0; height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px;
    background: color-mix(in srgb, var(--surface-solid) 72%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-right: 1px solid var(--line); z-index: 20;
  }
  .brand { font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 8px; color: var(--accent-strong); padding: 0 12px 16px; }
  .nav-btn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 16px; font-weight: 600; color: var(--ink); transition: background .15s; }
  .nav-btn:hover { background: var(--accent-softer); }
  .nav-btn.on { background: var(--accent-soft); color: var(--accent-strong); }
  .nav-btn:focus-visible { outline: 2.5px solid var(--accent-strong); }
  .nav-btn .ic { font-size: 20px; }
  .main { padding: 28px 32px 60px; max-width: 1240px; width: 100%; margin: 0 auto; min-width: 0; }
  .view[hidden] { display: none; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
  .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
  .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }

  .card {
    background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0;
  }
  .card h2 { font-size: 18px; font-weight: 700; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-h h1 { font-size: 30px; font-weight: 700; }
  .sub { color: var(--muted); margin: 4px 0 0; font-weight: 600; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btns.center { justify-content: center; }
  .grow { flex: 1; }

  /* Controles */
  .btn { font: inherit; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface-solid); color: var(--ink); padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s, filter .15s; white-space: nowrap; text-decoration: none; display: inline-block; line-height: 1.3; }
  .btn:hover { border-color: var(--accent); background: var(--accent-softer); }
  .btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
  .btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); filter: brightness(1.08); }
  .btn-danger { color: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 14px; }
  .icon-btn { font: inherit; width: 34px; height: 34px; flex: none; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
  .icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }
  .pill { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: var(--accent-soft); color: var(--accent-strong); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .pill:hover { filter: brightness(.97); }
  .badge { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 999px; }

  .inp, .fld input, .fld select, .fld textarea {
    font: inherit; font-weight: 500; color: var(--ink); background: var(--accent-softer);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; outline: none; width: 100%;
  }
  .inp:focus, .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); background: var(--surface-solid); }
  .fld { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .fld textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  .toggle input, input[type="range"] { accent-color: var(--accent-strong); }

  .seg { display: inline-flex; background: var(--accent-soft); border-radius: 999px; padding: 4px; }
  .seg button { border: 0; background: transparent; font: inherit; font-weight: 700; padding: 7px 16px; border-radius: 999px; color: var(--accent-strong); cursor: pointer; }
  .seg button.on { background: var(--surface-solid); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .navgrp { display: inline-flex; align-items: center; gap: 4px; }

  .chk { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: none; margin: 0; border-radius: 50%; border: 2px solid var(--c, var(--accent-strong)); background: var(--surface-solid); cursor: pointer; display: grid; place-items: center; }
  .chk:checked { background: var(--c, var(--accent-strong)); }
  .chk:checked::after { content: ''; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }

  /* Listas */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ev { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--cs); border-left: 5px solid var(--c); }
  .ev-block { background: color-mix(in srgb, var(--surface-solid) 60%, transparent); border: 1.5px dashed var(--c); border-left: 5px solid var(--c); }
  .blk-ic { width: 22px; text-align: center; color: var(--c); font-size: 18px; flex: none; }
  .ev-main { all: unset; cursor: pointer; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; border-radius: 8px; }
  .ev-main:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
  .ev-t { font-weight: 700; overflow-wrap: anywhere; }
  .ev-m { font-size: 13px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.done .ev-t { text-decoration: line-through; opacity: .55; }
  .list.big .ev { padding: 14px 16px; }
  .empty { text-align: center; padding: 22px 10px; color: var(--muted); font-weight: 600; }
  .empty > i { font-size: 42px; display: block; margin: 0 auto 6px; color: var(--accent); }
  .empty p { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  /* Inicio */
  .hero {
    position: relative; overflow: hidden; border-radius: 28px; padding: 36px 32px; min-height: 200px; margin-bottom: 20px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    background: linear-gradient(135deg, var(--accent-soft), var(--surface-solid) 60%, var(--accent-softer));
    background-size: cover; background-position: center; border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .hero.has-img::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, color-mix(in srgb, var(--surface-solid) 93%, transparent), color-mix(in srgb, var(--surface-solid) 40%, transparent) 60%, color-mix(in srgb, var(--surface-solid) 5%, transparent)); }
  .hero-deco { position: absolute; right: 18px; bottom: -18px; width: 210px; height: auto; opacity: .3; transform: rotate(-8deg); pointer-events: none; }
  .hero.has-img .hero-deco { display: none; }
  .hero-in, .hero-clock { position: relative; z-index: 1; }
  .hero-date { margin: 0; font-weight: 700; color: var(--muted); text-transform: capitalize; }
  .hero-hi { font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-weight: 900; font-size: clamp(34px, 5vw, 54px); line-height: 1; margin: 6px 0; color: var(--accent-strong); }
  .hero-sub { margin: 0; font-weight: 600; }
  .hero-clock { font-size: clamp(30px, 4vw, 46px); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .hero-edit { position: absolute; top: 14px; right: 14px; z-index: 2; background: color-mix(in srgb, var(--surface-solid) 85%, transparent); }

  .note { width: 100%; min-height: 170px; resize: vertical; font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-weight: 500; font-size: 18px; line-height: 31px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; outline: none;
    background-color: var(--paper); background-image: linear-gradient(transparent 30px, var(--line) 30px); background-size: 100% 31px; background-attachment: local; }
  .note:focus { border-color: var(--accent); }
  .mini-focus { text-align: center; }
  .mini-focus .t { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .mini-focus .l { color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .verse-mini { font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-style: italic; font-weight: 600; font-size: 21px; line-height: 1.2; margin: 0 0 6px; }
  .verse-mini-ref { font-weight: 700; color: var(--accent-strong); margin: 0; }
  .next-church { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }

  /* Recordatorios */
  .rem-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .rem-form .inp { flex: 1 1 160px; width: auto; }
  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .rem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--accent-softer); border: 1px solid var(--line); }
  .rem.past { opacity: .6; }
  .rem-ic { flex: none; font-size: 20px; color: var(--accent-strong); }
  .rem-b { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  details.past summary { cursor: pointer; color: var(--muted); font-weight: 700; margin: 14px 0 8px; font-size: 14px; }
  details.past .btn { margin-top: 10px; }

  /* Tablero */
  .board-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 34px; align-items: center; }
  .board { position: relative; height: 460px; border-radius: 18px; overflow: hidden;
    background-color: var(--accent-softer); background-image: radial-gradient(var(--line) 1.2px, transparent 1.6px); background-size: 18px 18px; }
  .board-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 700; text-align: center; padding: 20px; }
  .bi { position: absolute; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; transform: rotate(var(--rot, 0deg)); }
  .bi.dragging { cursor: grabbing; }
  .bi.sel { outline: 2.5px dashed var(--accent-strong); outline-offset: 5px; }
  .bi-photo { background: #fff; padding: 8px 8px 26px; border-radius: 6px; box-shadow: 0 10px 22px -8px rgba(0,0,0,.3); }
  .bi-photo::before { content: ''; position: absolute; top: -10px; left: 50%; width: 64px; height: 20px; transform: translateX(-50%) rotate(-3deg); background: var(--accent-soft); opacity: .9; border-radius: 2px; }
  .bi-photo img { display: block; width: 100%; height: auto; border-radius: 3px; pointer-events: none; }
  .bi-sticker { line-height: 1; text-align: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
  .bi-sticker i { display: block; }
  .bi-note { background: var(--note); padding: 14px 14px 18px; font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 19px; font-weight: 600; line-height: 1.25; min-height: 80px;
    white-space: pre-wrap; overflow-wrap: anywhere; border-radius: 4px; color: #3b2a33; box-shadow: 0 10px 20px -10px rgba(0,0,0,.35); }

  /* Planner */
  .day-card h2 { font-size: 20px; margin-bottom: 14px; text-transform: capitalize; }
  .day-card h2.is-today::after { content: 'Hoy'; margin-left: 10px; font-size: 13px; vertical-align: middle; background: var(--accent-strong); color: var(--on-accent); padding: 3px 10px; border-radius: 999px; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
  .wcol { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 340px; display: flex; flex-direction: column; padding: 8px; gap: 6px; box-shadow: var(--shadow); }
  .wcol.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .wcol-h { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 12px; }
  .wcol-h:hover { background: var(--accent-softer); }
  .wcol-h span { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .wcol-h strong { font-size: 20px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; }
  .wcol.today .wcol-h strong { background: var(--accent-strong); color: var(--on-accent); }
  .wcol-b { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .chip { all: unset; box-sizing: border-box; cursor: pointer; display: block; background: var(--cs); border-left: 4px solid var(--c); border-radius: 10px; padding: 6px 8px; font-size: 13px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .chip small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
  .chip-block { background: color-mix(in srgb, var(--surface-solid) 60%, transparent); border: 1.5px dashed var(--c); border-left: 4px solid var(--c); }
  .chip.done { opacity: .5; text-decoration: line-through; }
  .chip:focus-visible, .mcell:focus-visible, .wcol-h:focus-visible, .wadd:focus-visible, .blk:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .wadd { all: unset; cursor: pointer; text-align: center; border-radius: 10px; padding: 4px; color: var(--muted); font-size: 20px; font-weight: 700; }
  .wadd:hover { background: var(--accent-soft); color: var(--accent-strong); }

  .month { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: var(--shadow); }
  .mhead { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0 8px; text-transform: uppercase; }
  .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .mcell { all: unset; box-sizing: border-box; cursor: pointer; min-height: 100px; border-radius: 14px; background: var(--accent-softer); padding: 6px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; min-width: 0; }
  .mcell:hover { background: var(--accent-soft); }
  .mcell.out { opacity: .4; }
  .mnum { font-weight: 700; font-size: 13px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  .mcell.today .mnum { background: var(--accent-strong); color: var(--on-accent); }
  .mchip { font-size: 11px; font-weight: 700; background: var(--cs); border-left: 3px solid var(--c); border-radius: 6px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { font-size: 11px; color: var(--muted); font-weight: 700; }

  /* Horario */
  .sched-scroll { overflow-x: auto; }
  .sched { display: grid; grid-template-columns: 52px repeat(7, minmax(96px, 1fr)); min-width: 740px; gap: 0 6px; padding-bottom: 8px; }
  .sched-times { position: relative; margin-top: 40px; height: calc(var(--rows) * var(--hh)); }
  .sched-times span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 11px; color: var(--muted); font-weight: 700; }
  .sched-h { height: 40px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
  .sched-col.today .sched-h { color: var(--accent-strong); }
  .sched-b { position: relative; height: calc(var(--rows) * var(--hh)); border-radius: 14px; cursor: pointer;
    background: repeating-linear-gradient(to bottom, var(--accent-softer) 0, var(--accent-softer) calc(var(--hh) - 1px), var(--line) calc(var(--hh) - 1px), var(--line) var(--hh)); }
  .sched-col.today .sched-b { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .blk { all: unset; box-sizing: border-box; position: absolute; left: 3px; right: 3px; background: var(--cs); border-left: 4px solid var(--c); border-radius: 10px; padding: 4px 6px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .blk strong { font-size: 12.5px; line-height: 1.2; }
  .blk small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent-strong); z-index: 3; pointer-events: none; }
  .now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-strong); }
  .stat { display: grid; grid-template-columns: 90px 1fr 56px; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; margin: 8px 0; }
  .stat .bar { margin: 0; height: 10px; }
  .stat .bar span { background: var(--c); }
  .stat em { font-style: normal; color: var(--muted); text-align: right; }

  /* Iglesia */
  .verse-card { background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--surface-solid) 92%, transparent)); }
  .verse-text { all: unset; display: block; width: 100%; font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 26px; font-style: italic; font-weight: 600; line-height: 1.3; min-height: 40px; white-space: pre-wrap; field-sizing: content; }
  .verse-ref { all: unset; display: block; width: 100%; margin-top: 8px; font-weight: 700; color: var(--accent-strong); }
  .verse-text:focus, .verse-ref:focus { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 6px; }
  .pr { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px dashed var(--line); }
  .pr:last-child { border-bottom: 0; }
  .pr-t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .pr small { color: var(--muted); font-weight: 700; white-space: nowrap; }
  .pr.done .pr-t { text-decoration: line-through; opacity: .55; }
  .list.plain { gap: 0; margin-top: 10px; }
  .sub-h { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .sermon { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--accent-softer); border: 1px solid var(--line); }
  .sermon:hover { border-color: var(--accent); }
  .sermon:focus-visible { outline: 2px solid var(--accent-strong); }
  .sermon strong { display: block; }
  .sermon small { color: var(--muted); font-weight: 700; }
  .sermon p { margin: 6px 0 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Timers */
  .ring { position: relative; width: min(240px, 70vw); aspect-ratio: 1; margin: 16px auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--accent-soft); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent-strong); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-t { font-size: 50px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ring-l { color: var(--muted); font-weight: 700; }
  .cfg { margin-top: 18px; }
  .timers { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
  .tmr { background: var(--accent-softer); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .tmr-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tmr-h strong { overflow-wrap: anywhere; }
  .tmr-t { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; margin: 8px 0 10px; }
  .bar span { display: block; height: 100%; background: var(--accent-strong); border-radius: 3px; }
  .sw-t { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; margin: 20px 0; }

  /* Decorar */
  .themes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .theme { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 16px; border: 2px solid transparent; }
  .theme span { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); box-shadow: inset 0 0 0 3px var(--surface-solid), 0 2px 6px rgba(0,0,0,.12); }
  .theme.on { border-color: var(--accent); background: var(--accent-softer); }
  .theme:focus-visible { outline: 2px solid var(--accent-strong); }
  .pv { height: 150px; border-radius: 16px; background: var(--accent-softer) center / cover no-repeat; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); margin: 10px 0 12px; font-weight: 700; }
  .card > .inp { margin-top: 12px; }
  .app-card { display: flex; gap: 16px; align-items: flex-start; }
  .app-card > img { flex: none; border-radius: 18px; box-shadow: var(--shadow); }
  .brand img { flex: none; }
  .nav-foot { margin-top: auto; padding: 22px 12px 4px; display: flex; gap: 10px; align-items: flex-end; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .nav-foot img { flex: none; opacity: .9; }
  .nav-foot p { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 500; font-variation-settings: 'SOFT' 100, 'WONK' 1; }
  .nav-foot b { display: block; font-style: normal; font-weight: 800; margin-top: 4px; color: var(--accent-strong); }
  .empty-img { width: 58px; height: 58px; display: block; margin: 0 auto 6px; opacity: .9; }

  /* Modal */
  dialog.modal { border: 0; padding: 0; border-radius: 24px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 40px); color: var(--ink); background: var(--surface-solid); box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }
  dialog.modal::backdrop { background: rgba(75,57,66,.35); backdrop-filter: blur(3px); }
  .modal form { display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
  .modal-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 10px; }
  .modal-h h3 { font-size: 20px; }
  .modal-b { padding: 4px 22px 10px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal-f { display: flex; gap: 8px; align-items: center; padding: 14px 22px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .modal-err { margin: 0; color: var(--danger); font-weight: 700; font-size: 14px; }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .daychip { position: relative; }
  .daychip input, .swatch input { position: absolute; opacity: 0; pointer-events: none; }
  .daychip span { display: inline-block; padding: 7px 12px; border-radius: 999px; background: var(--accent-softer); border: 1.5px solid var(--line); font-weight: 700; cursor: pointer; color: var(--ink); font-size: 14px; }
  .daychip input:checked + span { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .daychip input:focus-visible + span, .swatch input:focus-visible + span { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .swatches { display: flex; gap: 10px; }
  .swatch { position: relative; }
  .swatch span { display: block; width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(0,0,0,.08); cursor: pointer; }
  .swatch input:checked + span { box-shadow: 0 0 0 3px var(--surface-solid), 0 0 0 5px var(--accent-strong); }
  .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; }
  .sticker-grid button { font: inherit; border: 0; background: transparent; cursor: pointer; font-size: 30px; padding: 6px; border-radius: 12px; }
  .sticker-grid button:hover { background: var(--accent-soft); }

  /* Toasts */
  #toasts { position: fixed; inset: auto; top: 16px; right: 16px; margin: 0; padding: 0; border: 0; background: transparent; overflow: visible;
    display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px)); z-index: 100; }
  #toasts:empty { pointer-events: none; }
  .toast { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-solid); color: var(--ink); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 18px; padding: 14px 12px 14px 14px; box-shadow: 0 16px 36px -14px rgba(0,0,0,.3); animation: tin .3s ease; font-family: var(--font-body); }
  .toast.out { animation: tout .25s ease forwards; }
  .toast-alert { background: var(--accent-softer); border-left-color: var(--accent-strong); }
  .toast-ic { font-size: 26px; line-height: 1; color: var(--accent-strong); }
  .toast-body { flex: 1; min-width: 0; }
  .toast-body strong { display: block; overflow-wrap: anywhere; }
  .toast-body p { margin: 2px 0 0; font-size: 14px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
  .toast-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .toast-actions:empty { display: none; }
  .toast-x { border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; padding: 0 4px; }
  @keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
  @keyframes tout { to { opacity: 0; transform: translateX(20px); } }


  /* Modo noche: neutros ciruela; cada tema ajusta sus acentos */
  html[data-mode="dark"] { color-scheme: dark;
    --bg: #1f141c; --surface: rgba(43,29,39,.9); --surface-solid: #2b1d27; --paper: #2b1d27;
    --ink: #f6e9ef; --muted: #bba5b1; --line: #4a3242;
    --accent: #f08bb5; --accent-strong: #f7a3c6; --accent-soft: #4a2a3c; --accent-softer: #33212c;
    --on-accent: #2a1420; --danger: #ff8a95; --good: #7fd6ae; --mm-root: #b8487a;
    --shadow: 0 12px 30px -14px rgba(0,0,0,.65); }
  html[data-mode="dark"][data-theme="lavanda"] { --bg:#19152a; --surface:rgba(37,32,56,.9); --surface-solid:#252038; --paper:#252038; --line:#3d3558; --accent:#b9a2f2; --accent-strong:#cdbbff; --accent-soft:#3a3058; --accent-softer:#2a2440; --on-accent:#1d1733; --mm-root:#7d5fcf; }
  html[data-mode="dark"][data-theme="durazno"] { --bg:#1f1612; --surface:rgba(44,31,26,.9); --surface-solid:#2c1f1a; --paper:#2c1f1a; --line:#4d362c; --accent:#f4a27c; --accent-strong:#ffb996; --accent-soft:#4a3025; --accent-softer:#33241d; --on-accent:#2a160d; --mm-root:#c0643c; }
  html[data-mode="dark"][data-theme="menta"] { --bg:#121c18; --surface:rgba(27,41,36,.9); --surface-solid:#1b2924; --paper:#1b2924; --line:#2f4a3f; --accent:#6cc4a4; --accent-strong:#8fe0c0; --accent-soft:#24413a; --accent-softer:#1d312b; --on-accent:#0f241c; --mm-root:#2f8a67; }
  html[data-mode="dark"][data-theme="nube"] { --bg:#121822; --surface:rgba(27,36,50,.9); --surface-solid:#1b2432; --paper:#1b2432; --line:#2f3e55; --accent:#7fb3e8; --accent-strong:#a5cbf5; --accent-soft:#24364f; --accent-softer:#1d2a3d; --on-accent:#0f1b2b; --mm-root:#3f76b3; }
  html[data-mode="dark"][data-theme="lirio"] { --bg:#171a16; --surface:rgba(35,40,34,.9); --surface-solid:#232822; --paper:#232822; --line:#3a4538; --accent:#e58fb3; --accent-strong:#f3a9c8; --accent-soft:#43303a; --accent-softer:#2d2a2a; --on-accent:#2a1420; --mm-root:#b8487a; }
  html[data-mode="dark"] .ev, html[data-mode="dark"] .chip, html[data-mode="dark"] .mchip, html[data-mode="dark"] .blk { background: color-mix(in srgb, var(--c) 24%, var(--surface-solid)); }
  html[data-mode="dark"] .ev-block, html[data-mode="dark"] .chip-block { background: color-mix(in srgb, var(--c) 8%, var(--surface-solid)); }
  html[data-mode="dark"] .px-gap.ok { background: #1f3a30; }
  html[data-mode="dark"] .px-gap.bad { background: #48232a; }
  html[data-mode="dark"] .leaflet-tile-pane { filter: invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95); }
  html[data-mode="dark"] .map .leaflet-popup-content-wrapper, html[data-mode="dark"] .map .leaflet-popup-tip { background: var(--surface-solid); color: var(--ink); }
  html[data-mode="dark"] .hero-deco { opacity: .22; }
  html[data-mode="dark"] .bi-photo { background: #f3ecef; }

  /* Navegación agrupada */
  .nav { overflow-y: auto; gap: 2px; }
  .nav-g { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 14px 4px; }
  .nav-btn { padding: 9px 14px; }

  .progress { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
  .progress span { display: block; height: 100%; background: var(--accent-strong); border-radius: 0 4px 4px 0; }
  .lesson-meta { font-size: 13px; color: var(--muted); font-weight: 600; }
  .row3 { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 12px; }
  .ev-bd, .chip-bd { --c: #e0679a; --cs: #ffeef5; }

  /* Estudio bíblico */
  .status { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .status-idea { background: #f3eaee; color: #7d6470; }
  .status-preparando { background: #fcefdf; color: #8f5714; }
  .status-lista { background: #dff4ec; color: #2c7457; }
  .status-impartida { background: #eee8fc; color: #5c45a3; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .lesson-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .lesson-card:hover { border-color: var(--accent); }
  .lesson-card:focus-visible { outline: 2px solid var(--accent-strong); }
  .lesson-card h3 { font-size: 17px; overflow-wrap: anywhere; }
  .next-lesson { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--surface-solid) 92%, transparent)); }
  .next-lesson .grow { min-width: 200px; }
  .next-lesson h2 { font-size: 22px; margin: 2px 0 6px; }
  .lesson-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .guide-title { font-size: 20px; text-align: center; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; color: var(--accent-strong); }
  .guide-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .guide-prog { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .guide-prog .progress { flex: 1; }
  .guide { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .guide-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .gbox { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .gbox-h { display: flex; align-items: center; gap: 10px; background: var(--accent-strong); color: var(--on-accent); padding: 10px 16px; font-weight: 700; }
  .gbox textarea { display: block; width: 100%; border: 0; outline: none; resize: vertical; font: inherit; font-weight: 500; color: var(--ink);
    padding: 8px 16px 14px; line-height: 30px; min-height: calc(30px * var(--lines, 6) + 22px); field-sizing: content;
    background-color: transparent; background-image: linear-gradient(transparent 29px, var(--line) 29px); background-size: 100% 30px; background-position: 0 8px; background-attachment: local; }
  .gbox textarea:focus { background-color: var(--paper); }

  dialog.present { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; border: 0; padding: 0; color: var(--ink);
    background: linear-gradient(160deg, var(--accent-softer), var(--surface-solid) 50%, var(--accent-soft)); font-family: var(--font-body); }
  .present-in { height: 100%; display: flex; flex-direction: column; padding: 20px clamp(20px, 5vw, 72px); }
  .present-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .present-time { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface-solid); border-radius: 999px; padding: 6px 16px; border: 1px solid var(--line); }
  .slide { flex: 1; overflow: auto; display: flex; flex-direction: column; justify-content: center; max-width: 1000px; width: 100%; margin: 0 auto; padding: 24px 0; }
  .slide-k { font-weight: 700; color: var(--accent-strong); text-transform: uppercase; letter-spacing: .1em; font-size: 15px; margin-bottom: 12px; }
  .slide-t { font-size: clamp(34px, 5vw, 64px); font-weight: 700; line-height: 1.1; margin: 0 0 18px; overflow-wrap: anywhere; }
  .slide-body { font-size: clamp(20px, 2.4vw, 30px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .slide-truth { font-size: clamp(28px, 3.6vw, 46px); font-weight: 700; line-height: 1.3; }
  .slide-ref { margin: 10px 0 0; font-weight: 700; color: var(--muted); }
  .slide-golden { font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-style: italic; font-weight: 600; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.2; margin: 18px 0 0; color: var(--accent-strong); }
  .present-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent-strong); }

  #printArea { display: none; }
  .pg { color: #000; font-family: var(--font-body); font-size: 11pt; }
  .pg h1 { text-align: center; font-size: 17pt; margin: 0 0 12px; letter-spacing: .02em; }
  .pg-top { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-bottom: 14px; }
  .pg-top div { border-bottom: 1px solid #000; padding: 2px 0; }
  .pg-top b { margin-right: 6px; }
  .pg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pg-col { display: flex; flex-direction: column; gap: 10px; }
  .pg-box { border: 1.5px solid #000; border-radius: 8px; overflow: hidden; break-inside: avoid; }
  .pg-box h2 { background: #000; color: #fff; font-size: 11pt; margin: 0; padding: 5px 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pg-box p { margin: 0; padding: 8px 10px; white-space: pre-wrap; min-height: 70px; line-height: 1.5; overflow-wrap: anywhere; }
  .pg-full { margin-top: 10px; }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff !important; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
  }

  /* Mapa mental */
  .mm-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .mm-title { font: inherit; font-size: 24px; font-weight: 700; border: 0; background: transparent; color: var(--ink); outline: none; min-width: 0; flex: 1; padding: 4px 6px; border-radius: 10px; }
  .mm-title:focus { background: var(--accent-softer); }
  .mm-colors { display: flex; gap: 6px; }
  .mm-colors button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface-solid); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .mm-wrap { position: relative; height: calc(100vh - 250px); min-height: 420px; overflow: auto; border-radius: 20px; border: 1px solid var(--line); outline: none;
    background-color: var(--accent-softer); background-image: radial-gradient(var(--line) 1.2px, transparent 1.6px); background-size: 22px 22px; cursor: grab; touch-action: none; }
  .mm-wrap:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
  .mm-wrap.panning { cursor: grabbing; }
  .mm-stage { position: relative; }
  .mm-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mm-inner svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .mm-inner path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .65; }
  .mm-node { position: absolute; transform: translate(-50%, -50%); max-width: 240px; min-width: 60px; padding: 10px 16px; border-radius: 16px; background: var(--surface-solid); color: var(--ink); border: 2.5px solid var(--nc);
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.25); font-weight: 700; text-align: center; cursor: pointer; user-select: none; -webkit-user-select: none; white-space: pre-wrap; overflow-wrap: anywhere; touch-action: none; line-height: 1.3; }
  .mm-node.root { background: var(--nc); color: #fff; font-size: 20px; padding: 14px 22px; border-radius: 22px; }
  .mm-node.sel { box-shadow: 0 0 0 5px var(--accent-soft), 0 6px 16px -8px rgba(0,0,0,.25); }
  .mm-node[contenteditable="true"] { cursor: text; user-select: text; -webkit-user-select: text; outline: 2px dashed var(--accent-strong); outline-offset: 4px; }

  /* Lugares */
  .map-card { padding: 0; overflow: hidden; position: relative; }
  .map { height: 580px; isolation: isolate; z-index: 0; background: var(--accent-softer); }
  .map-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 700; text-align: center; padding: 20px; }
  .pin { background: none; border: 0; }
  .pin span { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--surface-solid); border: 2.5px solid var(--accent-strong); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .pin b { transform: rotate(45deg); font-size: 18px; font-weight: 400; line-height: 1; color: var(--accent-strong); }
  .search-res { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .place { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 14px; background: var(--accent-softer); border: 1px solid var(--line); }
  .place-ic { font-size: 24px; line-height: 1.1; color: var(--accent-strong); }
  .place-b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .place-list { max-height: 480px; overflow: auto; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
  .map.leaflet-container { font-family: var(--font-body); }
  .map .leaflet-popup-content-wrapper { border-radius: 16px; }
  .pop b { display: block; font-size: 15px; }
  .pop small { display: block; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .pop .btns { margin-top: 10px; }

  /* Cumpleaños */
  .bd-today { text-align: center; background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--surface-solid) 92%, transparent)); margin-bottom: 18px; }
  .bd-today .big { font-size: 60px; line-height: 1.1; color: var(--accent-strong); }
  .bd-today h2 { font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 34px; color: var(--accent-strong); }
  .bd { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 14px; background: var(--accent-softer); border: 1px solid var(--line); }
  .bd:hover { border-color: var(--accent); }
  .bd:focus-visible { outline: 2px solid var(--accent-strong); }
  .bd-day { width: 46px; height: 46px; flex: none; border-radius: 14px; background: var(--surface-solid); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
  .bd-day strong { font-size: 18px; }
  .bd-day small { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .bd-b { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .bd-when { font-size: 13px; font-weight: 700; color: var(--accent-strong); white-space: nowrap; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 18px; }
  .month-card h3 { font-size: 16px; margin-bottom: 10px; text-transform: capitalize; }
  .month-card.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .month-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .month-card li button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 8px; width: 100%; font-weight: 600; font-size: 14px; padding: 4px 6px; border-radius: 8px; overflow-wrap: anywhere; }
  .month-card li button:hover { background: var(--accent-softer); }
  .month-card li button:focus-visible { outline: 2px solid var(--accent-strong); }
  .month-card li b { width: 22px; flex: none; color: var(--muted); }

  /* Finanzas */
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
  .tile > span { font-size: 13px; font-weight: 700; color: var(--muted); display: block; }
  .tile strong { font-size: clamp(20px, 2.4vw, 28px); font-weight: 700; font-variant-numeric: tabular-nums; display: block; margin-top: 4px; overflow-wrap: anywhere; }
  .tile small { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-top: 4px; }
  .hbar { display: grid; grid-template-columns: minmax(100px, 160px) 1fr auto; gap: 12px; align-items: center; font-size: 14px; font-weight: 600; padding: 6px 0; }
  .hbar .track { height: 12px; }
  .hbar .fill { height: 100%; min-width: 4px; background: var(--accent-strong); border-radius: 0 4px 4px 0; }
  .hbar em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; white-space: nowrap; }
  .hbar em small { color: var(--muted); margin-left: 6px; font-weight: 600; }
  .hbar:hover .fill { filter: brightness(1.1); }
  .tithe { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .tithe > div { background: var(--accent-softer); border-radius: 14px; padding: 12px; border: 1px solid var(--line); }
  .tithe strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .fin-form { display: grid; grid-template-columns: 120px 140px 1fr 1fr auto; gap: 8px; }
  .mv { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
  .mv:last-child { border-bottom: 0; }
  .mv-ic { color: var(--accent-strong); font-size: 22px; width: 28px; text-align: center; flex: none; }
  .mv-main { all: unset; cursor: pointer; flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; border-radius: 8px; }
  .mv-main:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
  .mv-amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mv-amt.in { color: var(--good); }
  .accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .acct { background: var(--accent-softer); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .acct-amt { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .acct .btns { margin-top: 4px; }
  .acct details.past summary { margin: 6px 0 4px; }

  /* Plan de premios */
  .aw-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .aw-date { font-family: var(--font-display); font-weight: 800; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 20px; text-transform: capitalize; padding: 0 4px; }
  .aw-table-wrap { overflow-x: auto; }
  .aw-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  .aw-table th { font-size: 12px; font-weight: 800; color: var(--muted); padding: 2px 4px; text-align: center; white-space: nowrap; }
  .aw-table th:first-child, .aw-table td:first-child { text-align: left; }
  .aw-table td { background: var(--accent-softer); padding: 6px 4px; text-align: center; }
  .aw-table td:first-child { border-radius: 14px 0 0 14px; font-weight: 700; padding-left: 14px; overflow-wrap: anywhere; }
  .aw-table td:last-child { border-radius: 0 14px 14px 0; font-weight: 800; font-variant-numeric: tabular-nums; padding-right: 12px; }
  .aw-table tr.absent td:first-child { color: var(--muted); }
  .aw-table .aw-foot td { background: transparent; font-weight: 800; color: var(--muted); }
  .mk { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-solid); color: transparent; cursor: pointer; font-size: 20px; display: inline-grid; place-items: center; transition: background .15s, border-color .15s; }
  .mk:hover { border-color: var(--accent); }
  .mk.on { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .mk:disabled { opacity: .35; cursor: not-allowed; }
  .col-btn { font: inherit; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; padding: 4px 6px; border-radius: 10px; }
  .col-btn i { font-size: 22px; color: var(--accent-strong); }
  .col-btn:hover { background: var(--accent-softer); }
  .linkish { all: unset; cursor: pointer; font-weight: 700; border-radius: 6px; overflow-wrap: anywhere; }
  .linkish:hover { color: var(--accent-strong); text-decoration: underline; }
  .linkish:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .hbar.rank { grid-template-columns: minmax(130px, 200px) 1fr auto; }
  .rank-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .rank-n { width: 24px; flex: none; text-align: center; color: var(--muted); font-weight: 800; }
  .rank-n i { color: var(--accent-strong); font-size: 19px; }
  .heat { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 14px; }
  .heat th { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; padding: 2px 4px; text-align: center; }
  .heat th:first-child { text-align: left; }
  .heat td { text-align: center; border-radius: 10px; padding: 8px 6px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 46px; }
  .heat td.name { text-align: left; font-weight: 700; min-width: 120px; padding-left: 2px; }
  .heat td.tot { background: var(--surface-solid); box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .heat tfoot td { color: var(--muted); }
  .heat.small td { background: var(--accent-softer); }
  .heat.small td.name { background: transparent; }
  .heat-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 10px; }
  .heat-legend .scale { display: inline-block; width: 110px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent-strong) 10%, var(--surface-solid)), var(--accent-strong)); }
  .pr.archived { opacity: .6; }
  .sync-ic { margin-left: auto; font-size: 18px; color: var(--muted); }
  .sync-ic.ok { color: var(--good); }
  .sync-ic.err { color: var(--danger); }
  .sync-status { font-weight: 700; margin: 8px 0 12px; display: flex; align-items: center; gap: 6px; }
  .sync-status.err { color: var(--danger); }
  [data-sync-card] h2 { display: flex; align-items: center; gap: 8px; }
  code { font-size: .9em; background: var(--accent-softer); padding: 1px 5px; border-radius: 5px; }
  .choice { display: flex; flex-direction: column; gap: 10px; }
  .choice .btn { text-align: left; white-space: normal; padding: 12px 16px; }
  .choice .btn small { display: block; font-weight: 600; opacity: .8; margin-top: 2px; }

  /* Búsqueda */
  dialog.search-dlg { width: min(640px, calc(100vw - 32px)); margin: 10vh auto auto; max-height: 76vh; }
  dialog.search-dlg[open] { display: flex; flex-direction: column; }
  .sr-box { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .sr-box > i { font-size: 22px; color: var(--accent-strong); }
  .sr-box input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; color: var(--ink); background: transparent; }
  .kbd { font: inherit; font-size: 11px; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--accent-softer); white-space: nowrap; }
  .nav-search .kbd { margin-left: auto; }
  .sr-results { overflow: auto; padding: 6px 10px 14px; }
  .sr-g { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 8px 4px; }
  .sr-item { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 14px; cursor: pointer; }
  .sr-item > i { font-size: 22px; color: var(--accent-strong); margin-top: 2px; }
  .sr-item:hover, .sr-item.on { background: var(--accent-softer); }
  .sr-item.on { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .sr-b { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
  .sr-b small { color: var(--muted); font-weight: 600; }
  .sr-snip { font-size: 13px; opacity: .85; margin-top: 2px; }
  .sr-b mark { background: var(--accent-soft); color: var(--accent-strong); border-radius: 3px; padding: 0 1px; }
  .sr-empty { padding: 18px 8px; text-align: center; }
  .flash { animation: flash 1.8s ease; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* Hábitos */
  .habits { display: flex; flex-direction: column; gap: 10px; }
  details.past .habits { margin-top: 8px; }
  .habit { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: var(--accent-softer); border: 1px solid var(--line); }
  .habit.done { background: color-mix(in srgb, var(--hc) 12%, var(--surface-solid)); border-color: color-mix(in srgb, var(--hc) 40%, var(--surface-solid)); }
  .hb-check { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid var(--hc); background: var(--surface-solid); color: var(--hc); font: inherit; font-weight: 800; font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: transform .1s; }
  .hb-check span { font-size: 14px; font-variant-numeric: tabular-nums; }
  .hb-check:active { transform: scale(.94); }
  .habit.done .hb-check { background: var(--hc); color: #fff; }
  .hb-b { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .hb-streak { font-weight: 800; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hb-streak i { color: #e8793a; }
  .hb-cals { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .hb-cal h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
  .hb-cal h3 i { color: var(--hc); font-size: 22px; }
  .hb-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; }
  .hb-stats b { display: block; font-size: 18px; color: var(--ink); font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; }
  .hc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .hc-grid > span { font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; }
  .hc { font: inherit; font-size: 12px; font-weight: 700; aspect-ratio: 1; border-radius: 8px; border: 0; background: var(--accent-softer); color: var(--ink); cursor: pointer; padding: 0; }
  .hc.on { background: var(--hc); color: #fff; }
  .hc.part { background: color-mix(in srgb, var(--hc) 30%, var(--surface-solid)); }
  .hc.miss { background: var(--surface-solid); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--hc) 45%, var(--surface-solid)); }
  .hc.fut { opacity: .4; cursor: default; }
  .hb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .hb-chip { font: inherit; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--hc); background: var(--surface-solid); color: var(--ink); cursor: pointer; }
  .hb-chip i { color: var(--hc); font-size: 18px; }
  .hb-chip.done { background: var(--hc); color: #fff; }
  .hb-chip.done i { color: #fff; }
  .hb-chip small { opacity: .85; font-variant-numeric: tabular-nums; }
  .hb-icons { display: flex; flex-wrap: wrap; gap: 8px; }
  .hb-ic span { display: grid; place-items: center; font-size: 20px; color: var(--accent-strong); background: var(--accent-softer); }
  .aw-verse { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--accent-softer); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
  .aw-verse > i { font-size: 22px; color: var(--accent-strong); }
  .aw-verse-text small { font-family: var(--font-body); font-style: normal; font-weight: 700; color: var(--muted); }
  .aw-verse-text { margin: 0; flex-basis: 100%; font-family: var(--font-display); font-style: italic; font-weight: 500; font-variation-settings: 'SOFT' 100, 'WONK' 1; }

  /* Versículos */
  .verses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .verse-card2 { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .verse-card2 h3 { font-size: 18px; overflow-wrap: anywhere; }
  .verse-card2 h3 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 700; }
  .vs-text { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 500; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 17px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .vs-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: auto; }
  .status-vs-aprendiendo { background: #fcefdf; color: #8f5714; }
  .status-vs-casi { background: #eee8fc; color: #5c45a3; }
  .status-vs-memorizado { background: #dff4ec; color: #2c7457; }
  .px-verse { font-size: clamp(22px, 2.8vw, 34px); }
  .px-letters { letter-spacing: .08em; font-weight: 700; }
  .px-hint { text-align: center; font-size: 16px; }
  .px-gap { font: inherit; font-size: .9em; border: 0; border-bottom: 2.5px solid var(--accent); background: var(--accent-softer); border-radius: 8px 8px 0 0; padding: 0 6px; color: var(--ink); text-align: center; outline: none; max-width: 100%; }
  .px-gap:focus { background: var(--surface-solid); border-color: var(--accent-strong); }
  .px-gap.ok { border-color: #3a9674; background: #dff4ec; }
  .px-gap.bad { border-color: var(--danger); background: #fbe3e3; }
  .px-fix { font-size: .55em; color: var(--good); font-weight: 800; margin-left: 4px; vertical-align: super; }
  .px-rate small { opacity: .65; font-size: .75em; margin-left: 4px; }
  .px-sum { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 20px; }
  .px-sum div { background: var(--surface-solid); border: 1px solid var(--line); border-radius: 18px; padding: 14px 20px; text-align: center; min-width: 110px; }
  .px-sum strong { display: block; font-family: var(--font-display); font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 36px; }
  .px-sum span { color: var(--muted); font-weight: 700; }
  .bd-near { color: var(--accent-strong); font-size: 16px; }
  .pr strong { font-variant-numeric: tabular-nums; }

  @media (max-width: 980px) {
    .span-4, .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .fin-form { grid-template-columns: 1fr 1fr; }
    .fin-form .btn { grid-column: span 2; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .nav { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; justify-content: space-around; gap: 0;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface-solid) 94%, transparent); z-index: 50; }
    .brand { display: none; }
    .nav-btn { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 10.5px; text-align: center; border-radius: 12px; }
    .main { padding: 16px 16px 96px; }
    .hero { padding: 26px 20px; flex-direction: column; align-items: flex-start; min-height: 180px; }
    .hero-deco { width: 130px; bottom: -10px; right: 6px; }
    .page-h h1 { font-size: 26px; }
    .week { grid-template-columns: 1fr; }
    .wcol { min-height: 0; }
    .wcol-h { flex-direction: row; gap: 10px; align-self: flex-start; }
    .wadd { position: absolute; top: 12px; right: 12px; }
    .mcell { min-height: 58px; padding: 4px; }
    .mchip { font-size: 0; height: 6px; padding: 0; border: 0; background: var(--c); border-radius: 3px; }

<script>
'use strict';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const localIso = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = d => (d.getDay() + 6) % 7; // 0 = lunes
const startOfWeek = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -dow(d));
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);

const DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const DIAS_C = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = d => `${DIAS[dow(d)]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
const shortDate = k => { const d = fromYmd(k); return `${DIAS_C[dow(d)]} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };
const fmtDur = ms => {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`;
};
const fmtSw = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return `${h ? h + ':' : ''}${pad(m)}:${pad(s % 60)}.${Math.floor(ms % 1000 / 100)}`;
};
const fmtWhen = iso => {
  const d = new Date(iso), k = ymd(d), t = new Date();
  if (k === ymd(t)) return 'Hoy · ' + hhmm(d);
  if (k === ymd(addDays(t, 1))) return 'Mañana · ' + hhmm(d);
  return `${shortDate(k)} · ${hhmm(d)}`;
};
const greet = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; };
const ic = (n, v = '') => `<i class="ph${v ? '-' + v : ''} ph-${n}" aria-hidden="true"></i>`;
const LIRIO = '<img src="icons/logo.svg" alt="" style="width:1em;height:1em;display:block">';
const stickerHtml = n => n === 'convalaria' ? LIRIO : ic(n, 'duotone');
const empty = (t, icn = 'convalaria') => `<div class="empty">${icn === 'convalaria' ? '<img class="empty-img" src="icons/logo.svg" alt="">' : ic(icn, 'duotone')}<p>${t}</p></div>`;
const byTime = (a, b) => (toMin(a.time) ?? -1) - (toMin(b.time) ?? -1);

const CATS = {
  personal: { label: 'Personal', color: '#ec7fa9', soft: '#fde6ef' },
  trabajo:  { label: 'Trabajo',  color: '#a48be6', soft: '#eee8fc' },
  iglesia:  { label: 'Iglesia',  color: '#e9a55c', soft: '#fcefdf' },
  estudio:  { label: 'Estudio',  color: '#5fbf9c', soft: '#dff4ec' },
  casa:     { label: 'Casa',     color: '#6fa8dc', soft: '#e2eefa' },
  salud:    { label: 'Salud',    color: '#e57b7b', soft: '#fbe3e3' },
  otro:     { label: 'Otro',     color: '#b89aa9', soft: '#f3eaee' },
};
const cat = k => CATS[k] || CATS.otro;
const catVars = k => `--c:${cat(k).color};--cs:${cat(k).soft}`;
const catOptions = sel => Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${c.label}</option>`).join('');
const REMIND_OPTS = [['', 'Sin recordatorio'], ['0', 'A la hora'], ['5', '5 min antes'], ['10', '10 min antes'], ['15', '15 min antes'], ['30', '30 min antes'], ['60', '1 hora antes'], ['1440', '1 día antes']];
const THEMES = [
  { k: 'rosa', label: 'Rosa', a: '#ec7fa9', b: '#fde4ee' },
  { k: 'lavanda', label: 'Lavanda', a: '#a98ee8', b: '#ece5fb' },
  { k: 'durazno', label: 'Durazno', a: '#f4a27c', b: '#fde7dc' },
  { k: 'menta', label: 'Menta', a: '#6cc4a4', b: '#dcf3ea' },
  { k: 'nube', label: 'Nube', a: '#7fb3e8', b: '#e1eefb' },
  { k: 'lirio', label: 'Lirio', a: '#d4679a', b: '#d7ecdc' },
];
const STICKERS = 'convalaria heart flower flower-lotus flower-tulip butterfly bird cat rabbit dog paw-print star sparkle sun moon-stars cloud rainbow crown diamond gift confetti cake ice-cream cookie coffee music-notes headphones camera book-open bookmark-simple push-pin envelope-simple cross church hands-praying hand-heart leaf plant smiley lightbulb fire'.split(' ');
const STICKER_COLORS = ['#e0679a', '#9b7fe0', '#ee8f63', '#4fb08c', '#5f9ad8', '#d9a520'];
const NOTE_COLORS = ['#fff3b0', '#ffd6e5', '#e3d9ff', '#d4f5e6', '#d8ecff'];

/* ---------- Estado ---------- */
const KEY = 'mi-espacio-v1';
const defaults = () => ({
  name: '', theme: 'rosa', bannerId: null, bgId: null, veil: 55,
  events: [], blocks: [], reminders: [], prayers: [], sermons: [], churchTodos: [],
  verse: { text: '', ref: '' }, note: '', board: [], timers: [],
  pomo: { work: 25, rest: 5, mode: 'work', endAt: null, left: 25 * 60000, count: 0, countDate: '' },
  sw: { startAt: null, acc: 0 },
  lessons: [], mindmaps: [], places: [], birthdays: [], money: [],
  moneyCfg: { currency: 'CLP', budget: 0, opening: null },
  savings: [], savingsMoves: [], owed: [],
  awards: { students: [], days: {} },
  verses: [], verseLog: [], vsMode: 'tarjeta',
  habits: [], habitLog: {},
  plannerView: 'semana', showBlocks: true, lastView: 'inicio',
  darkMode: 'auto', darkFrom: '20:00', darkTo: '07:00',
});
function normalize(raw) {
  const s = Object.assign(defaults(), raw || {});
  s.pomo = Object.assign(defaults().pomo, raw?.pomo);
  s.sw = Object.assign(defaults().sw, raw?.sw);
  s.verse = Object.assign({ text: '', ref: '' }, raw?.verse);
  s.moneyCfg = Object.assign(defaults().moneyCfg, raw?.moneyCfg);
  s.awards = Object.assign(defaults().awards, raw?.awards);
  if (!Array.isArray(s.awards.students)) s.awards.students = [];
  if (!s.awards.days || typeof s.awards.days !== 'object') s.awards.days = {};
  delete s.awards.verses;
  if (!s.habitLog || typeof s.habitLog !== 'object' || Array.isArray(s.habitLog)) s.habitLog = {};
  ['events', 'blocks', 'reminders', 'prayers', 'sermons', 'churchTodos', 'board', 'timers',
   'lessons', 'mindmaps', 'places', 'birthdays', 'money', 'savings', 'savingsMoves', 'owed', 'verses', 'verseLog', 'habits'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}
function load() { try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch { return defaults(); } }
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast({ title: 'No se pudo guardar', text: 'El navegador no tiene espacio o bloquea el guardado.', icon: 'warning' }); }
}
function save() { saveLocal(); syncTouch(); }
// Cambios automáticos (avisos marcados): se sincronizan, pero ceden ante lo que venga de la nube
function saveBg() { saveLocal(); syncTouch(true); }
let S = load();

/* ---------- Fotos (IndexedDB, con respaldo en localStorage) ---------- */
const IMG = new Map();
const imgStore = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('mi-espacio-fotos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fotos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('fotos', mode);
      const req = fn(t.objectStore('fotos'));
      t.oncomplete = () => res(req.result);
      t.onerror = () => rej(t.error);
    });
  };
  const lsKey = id => 'mi-espacio-foto-' + id;
  return {
    async put(id, data) {
      IMG.set(id, data);
      try { await run('readwrite', s => s.put(data, id)); }
      catch {
        try { localStorage.setItem(lsKey(id), data); }
        catch { toast({ title: 'Foto sin guardar', text: 'No queda espacio para guardar esta foto.', icon: 'warning' }); }
      }
    },
    async get(id) {
      if (IMG.has(id)) return IMG.get(id);
      let data = null;
      try { data = await run('readonly', s => s.get(id)); } catch {}
      if (!data) { try { data = localStorage.getItem(lsKey(id)); } catch {} }
      if (data) IMG.set(id, data);
      return data;
    },
    async del(id) {
      if (!id) return;
      IMG.delete(id);
      try { await run('readwrite', s => s.delete(id)); } catch {}
      try { localStorage.removeItem(lsKey(id)); } catch {}
    },
  };
})();
const allImgIds = () => [S.bannerId, S.bgId, ...S.board.filter(i => i.type === 'photo').map(i => i.imgId)].filter(Boolean);

function fileToDataUrl(file, max = 1400) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
    img.src = url;
  });
}
function pickImage(multiple = false) {
  return new Promise(res => {
    const inp = $('#filePick');
    inp.multiple = multiple; inp.value = '';
    inp.onchange = async () => {
      const out = [];
      for (const f of inp.files) {
        try { const data = await fileToDataUrl(f); const id = uid(); await imgStore.put(id, data); out.push(id); }
        catch { toast({ title: 'No pude leer la foto', text: f.name, icon: 'warning' }); }
      }
      res(out);
    };
    inp.click();
  });
}

/* ---------- Avisos: toast, sonido, notificación ---------- */
const toastBox = $('#toasts');
function syncToastLayer() {
  if (!toastBox.showPopover) return;
  try {
    if (toastBox.matches(':popover-open')) toastBox.hidePopover();
    if (toastBox.children.length) toastBox.showPopover();
  } catch {}
}
function toast({ title, text = '', icon = 'flower-lotus', persist = false, actions = [] }) {
  const el = document.createElement('div');
  el.className = 'toast' + (persist ? ' toast-alert' : '');
  el.setAttribute('role', persist ? 'alert' : 'status');
  el.innerHTML = `<div class="toast-ic">${ic(icon, 'duotone')}</div><div class="toast-body"><strong>${esc(title)}</strong>${text ? `<p>${esc(text)}</p>` : ''}<div class="toast-actions"></div></div><button class="toast-x" aria-label="Cerrar">${ic('x')}</button>`;
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    el.classList.add('out');
    setTimeout(() => { el.remove(); syncToastLayer(); }, 250);
  };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn btn-sm' + (a.primary ? ' btn-primary' : '');
    b.textContent = a.label;
    b.onclick = () => { a.fn && a.fn(); close(); };
    $('.toast-actions', el).appendChild(b);
  });
  $('.toast-x', el).onclick = close;
  toastBox.appendChild(el);
  syncToastLayer();
  if (!persist) setTimeout(close, 4200);
}

let actx = null;
document.addEventListener('pointerdown', () => {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    else if (actx.state === 'suspended') actx.resume();
  } catch {}
}, { capture: true });
function chime() {
  if (!actx) return;
  const now = actx.currentTime;
  [880, 1174.66, 1318.51].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = now + i * 0.18;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.75);
  });
}
function alertUser(title, text, icon, actions = []) {
  chime();
  toast({ title, text, icon, persist: true, actions });
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(title, { body: text });
  } catch {}
}

/* ---------- Modal ---------- */
const modal = $('#modal');
function openModal(title, body, { onSave, onDelete, saveLabel = 'Guardar', noSave = false, onOpen } = {}) {
  const f = $('#modalForm');
  f.innerHTML = `
    <header class="modal-h"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></header>
    <div class="modal-b">${body}<p class="modal-err" hidden></p></div>
    <footer class="modal-f">
      ${onDelete ? '<button type="button" class="btn btn-danger" data-del>Eliminar</button>' : ''}
      <span class="grow"></span>
      <button type="button" class="btn" data-close>${noSave ? 'Cerrar' : 'Cancelar'}</button>
      ${noSave ? '' : `<button type="submit" class="btn btn-primary">${saveLabel}</button>`}
    </footer>`;
  const err = $('.modal-err', f);
  f.onsubmit = e => {
    e.preventDefault();
    const bad = $$('[required]', f).find(i => !i.value.trim());
    if (bad) { err.textContent = 'Completa los campos obligatorios.'; err.hidden = false; bad.focus(); return; }
    const r = onSave ? onSave(new FormData(f), f) : null;
    if (typeof r === 'string') { err.textContent = r; err.hidden = false; return; }
    modal.close();
  };
  $$('[data-close]', f).forEach(b => b.onclick = () => modal.close());
  const del = $('[data-del]', f);
  if (del) del.onclick = () => { if (confirm('¿Eliminar definitivamente?')) { onDelete(); modal.close(); } };
  modal.showModal();
  onOpen && onOpen(f);
  const first = $('input:not([type=checkbox]):not([type=radio]), textarea, select', f);
  first && first.focus();
}
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });

/* ---------- Actividades del planner ---------- */
function eventTrigger(e) {
  if (e.remind === '' || e.remind == null) return null;
  const d = fromYmd(e.date);
  d.setMinutes((toMin(e.time) ?? 540) - Number(e.remind));
  return d.getTime();
}
function eventModal(ev = null, preset = {}) {

function dayAgenda(d, withBlocks = S.showBlocks) {

  return [...bds, ...evs, ...bls].sort((a, b) => a.t - b.t);
}

function addReminder(text, when) {
  S.reminders.push({ id: uid(), text, at: when, fired: false });
  save(); renderReminderLists();

const remItem = r => `<li class="rem ${r.fired ? 'past' : ''}"><span class="rem-ic">${r.fired ? ic('check') : ic('bell', 'duotone')}</span>
  <div class="rem-b"><span class="ev-t">${esc(r.text)}</span><span class="ev-m">${fmtWhen(r.at)}</span></div>
  <button class="icon-btn" data-act="remDel" data-id="${r.id}" aria-label="Eliminar">${ic('x')}</button></li>`;
function remindersCardHtml() {
  const list = [...S.reminders].sort((a, b) => a.at.localeCompare(b.at));
  const up = list.filter(r => !r.fired), past = list.filter(r => r.fired).reverse();
  return `<div class="card-h"><h2>Recordatorios</h2>${up.length ? `<span class="badge">${up.length}</span>` : ''}</div>
    <form class="rem-form" data-form="rem">
      <input class="inp" name="text" required maxlength="140" placeholder="Recuérdame…">
